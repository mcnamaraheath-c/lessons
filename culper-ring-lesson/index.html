];

/* ---------- world ---------- */
const W={
  on:false, init:false,
  px:4, py:4, pf:"d",
  tw:null,               // {fx,fy,tx,ty,t0,dur}
  held:[], stepFrame:0,
  guards:[], caughtUntil:0, waterT:0, waterF:0,
  focus:null, dirtyLabels:true, lastLabelKey:"",
  dbg:false, noclip:false,
};
const DIRV={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
const DIR2C={d:"south",u:"north",l:"west",r:"east"};   // game facing -> registry facing

/* persistent actor pool + scratch position — no per-frame allocation */
const ACTORS=[];
const POS={x:0,y:0};

function initWorld(){
  if(!W.init){
    SWART.init();                                   // one-time: rasterize + bake terrain + audit
    W.sprAnna=SWART.registry.anim("anna.walk");
    W.sprNpc={};
    ENTS.forEach(e=>{ W.sprNpc[e.id]=SWART.registry.anim(e.sprite+".idle")[e.facing][0]; });
    W.sprBrewsterN=SWART.registry.get("npc.brewster.idle.north");
    W.sprBoat=SWART.registry.get("prop.boat");
    W.clothesline=SETAUKET.find("C")[0];
    bindMapInput();
    W.init=true;
  }
  W.px=S.map.x; W.py=S.map.y; W.pf=S.map.f||"d"; W.tw=null; W.held=[];
  W.guards=GUARD_DEF.map((g,i)=>{
    const gd={...g, x:g.wp[0][0], y:g.wp[0][1], f:"r", idx:0, dir:1, tw:null, wait:0,
      sf:0, anim:SWART.registry.anim(g.variant)};
    const sv=S.map.g&&S.map.g[i];               // restore patrol phase from a save code
    if(sv){
      gd.x=Math.max(0,Math.min(MW-1,sv[0]|0));
      gd.y=Math.max(0,Math.min(MH-1,sv[1]|0));
      gd.idx=Math.max(0,Math.min(g.wp.length-1,sv[2]|0));
      gd.dir=sv[3]===-1?-1:1;
    }
    return gd;
  });
  ACTORS.length=0;
  for(let i=0;i<ENTS.length+W.guards.length+1;i++) ACTORS.push({x:0,y:0,spr:null,dz:0});
  W.caughtUntil=performance.now()+3000;
}
function enterMap(){
  S.scene="map";
  show("s-map");
  initWorld();
  W.on=true;
  renderObj(); updateHUD(); fitCanvas();
  requestAnimationFrame(loop);
  $("cv").focus({preventScroll:true});
  autoSave();
}
const enterMapBackdrop=enterMap;
function resumeMap(){
  W.caughtUntil=performance.now()+6000;
  if(!W.on) enterMap();
  else $("cv").focus({preventScroll:true});
  autoSave();
}
function stopMap(){ W.on=false; }

function walkable(x,y){
  if(W.noclip) return x>=0&&y>=0&&x<MW&&y<MH;
  if(BLOCK.has(tileAt(x,y))) return false;
  if(SETAUKET.propBlocked(x,y)) return false;   // solid props (barrels, trough…)
  if(ENTS.some(e=>e.x===x&&e.y===y)) return false;
  if(W.guards.some(g=>g.x===x&&g.y===y)) return false;
  return true;
}

/* ---------- input ---------- */
const KEYD={ArrowUp:"u",ArrowDown:"d",ArrowLeft:"l",ArrowRight:"r",w:"u",s:"d",a:"l",d:"r",W:"u",S:"d",A:"l",D:"r"};
function bindMapInput(){
  document.addEventListener("keydown",e=>{
    if($("s-map").hidden) return;
    if(e.key==="`"){ W.dbg=!W.dbg; W.noclip=W.dbg; return; }
    if(W.dbg && e.key==="j"){ const id=prompt("node id:"); if(id&&NODES[id]) go(id); return; }
    if(W.dbg && (e.key==="p"||e.key==="P")){ SWART.preview.isOpen()?SWART.preview.close():SWART.preview.open(); return; }
    if(anyModalOpen()){
      if(e.key==="Escape"){ ["m-book","m-vocab","m-info"].forEach(id=>$(id).hidden=true); }
      return;
    }
    if(e.key==="Escape"){ e.preventDefault(); renderPause(); openModal("m-pause"); return; }
    const d=KEYD[e.key];
    if(d){ e.preventDefault(); if(!W.held.includes(d)) W.held.push(d); return; }
    if(e.key==="e"||e.key==="E"||e.key===" "||e.key==="Enter"){ e.preventDefault(); interact(); }
  });
  document.addEventListener("keyup",e=>{
    const d=KEYD[e.key];
    if(d) W.held=W.held.filter(x=>x!==d);
  });
  window.addEventListener("blur",()=>{W.held=[];});
  // d-pad
  document.querySelectorAll("#dpad [data-d]").forEach(b=>{
    const d=b.dataset.d;
    const on=e=>{e.preventDefault(); if(!W.held.includes(d)) W.held.push(d);};
    const off=e=>{e.preventDefault(); W.held=W.held.filter(x=>x!==d);};
    b.addEventListener("pointerdown",on);
    b.addEventListener("pointerup",off);
    b.addEventListener("pointercancel",off);
    b.addEventListener("pointerleave",off);
  });
  $("btn-act").addEventListener("click",()=>{ if(!anyModalOpen()) interact(); });
  // tap adjacent tile to interact
  $("cv").addEventListener("click",e=>{
    if(anyModalOpen()) return;
    const r=$("cv").getBoundingClientRect();
    const sc=r.width/640;
    const x=Math.floor((e.clientX-r.left)/sc/TILE), y=Math.floor((e.clientY-r.top)/sc/TILE);
    const dx=x-W.px, dy=y-W.py;
    if(Math.abs(dx)+Math.abs(dy)===1){
      W.pf = dx===1?"r":dx===-1?"l":dy===1?"d":"u";
      if(interactTarget(x,y)) interact();
    }
  });
  window.addEventListener("resize",fitCanvas);
}
function fitCanvas(){
  const cv=$("cv");
  const availW=Math.min(window.innerWidth-28, 1040);
  const top=cv.getBoundingClientRect().top;
  const availH=Math.max(300, window.innerHeight-top-(touchUI()?16:16));
  let s=Math.min(availW/640, availH/480);
  if(s>=1) s=Math.floor(s);
  cv.style.width=(640*s)+"px"; cv.style.height=(480*s)+"px";
}

/* ---------- interaction ---------- */
function interactTarget(x,y){
  const e=ENTS.find(e=>e.x===x&&e.y===y);
  if(e) return {ent:e};
  const ch=tileAt(x,y);
  if(TILE_LABEL[ch]) return {tile:ch};
  return null;
}
function facedTarget(){
  const [dx,dy]=DIRV[W.pf];
  return interactTarget(W.px+dx, W.py+dy);
}
function interact(){
  const t=facedTarget();
  if(!t) return;
  if(t.ent){ runNode(t.ent.node()); return; }
  if(t.tile==="C"){ runNode(ENT_NODE.clothesline()); }
  else if(t.tile==="A"){ runNode(ENT_NODE.house()); }
  else if(t.tile==="V"){ runNode("tav1"); }
}
function runNode(id){
  if(!id) return;
  if(id==="@clothesline"){ startPuzzle("clothesline",()=>go("cs1")); return; }
  go(id);
}

/* ---------- triggers ---------- */
function fired(id){ return S.map.fired.includes(id); }
function fire(id){ if(!fired(id)) S.map.fired.push(id); }
function onArrive(){
  S.map.x=W.px; S.map.y=W.py; S.map.f=W.pf;
  const ch=tileAt(W.px,W.py);
  if(S.obj==="dock" && ch==="B"){ go("br1"); return; }
  if(S.obj!=="dock" && (ch==="b"||ch==="B") && !fired("dockearly")){ fire("dockearly"); go("dock_early"); return; }
  if(S.obj==="watch" && ((W.py===9&&W.px>=2&&W.px<=14)||(W.px===9&&W.py===10))){ go("w1"); return; }
  autoSave();
}

/* ---------- update ---------- */
let lastTs=0;
function loop(ts){
  if(!W.on) return;
  requestAnimationFrame(loop);
  const dt=Math.min(50,ts-lastTs); lastTs=ts;
  if(!anyModalOpen()) update(ts,dt);
  draw(ts);
}
function moveDur(){ return 140; } /* cadence; reduced-motion snaps visually in lerpPos */
function update(ts,dt){
  // player tween
  if(W.tw){
    if(ts-W.tw.t0>=W.tw.dur){
      W.px=W.tw.tx; W.py=W.tw.ty; W.tw=null; W.stepFrame^=1;
      onArrive();
      if(!W.on||anyModalOpen()) return;
    }
  }
  if(!W.tw && W.held.length){
    const d=W.held[W.held.length-1];
    W.pf=d;
    const [dx,dy]=DIRV[d];
    const nx=W.px+dx, ny=W.py+dy;
    if(walkable(nx,ny)) W.tw={fx:W.px,fy:W.py,tx:nx,ty:ny,t0:ts,dur:moveDur()};
  }
  // guards
  W.guards.forEach(g=>{
    if(g.tw){
      if(ts-g.tw.t0>=g.tw.dur){ g.x=g.tw.tx; g.y=g.tw.ty; g.tw=null; g.sf^=1;   // step frame flips per tile, like the player
        if(SET.calm && (g.x===g.wp[g.idx][0]&&g.y===g.wp[g.idx][1])) g.wait=ts+2000;
      }
      return;
    }
    if(g.wait&&ts<g.wait) return;
    const [wx,wy]=g.wp[g.idx];
    if(g.x===wx&&g.y===wy){
      g.idx+=g.dir;
      if(g.idx>=g.wp.length||g.idx<0){ g.dir*=-1; g.idx+=2*g.dir; }
      if(SET.calm) g.wait=ts+2000;
      return;
    }
    const dx=Math.sign(wx-g.x), dy=Math.sign(wy-g.y);
    g.f = dx===1?"r":dx===-1?"l":dy===1?"d":"u";
    const nx=g.x+dx, ny=g.y+dy;
    if(nx===W.px&&ny===W.py) return; // wait for player to move
    g.tw={fx:g.x,fy:g.y,tx:nx,ty:ny,t0:ts,dur:moveDur()};
  });
  // caught?
  if(ts>W.caughtUntil && RESTRICT.has(tileAt(W.px,W.py)) && !W.tw){
    for(const g of W.guards){
      if(coneHits(g,W.px,W.py)){
        W.caughtUntil=ts+9e9; // dialogue will reset on resume
        go("gc1");
        break;
      }
    }
  }
  // water anim
  if(!reducedMotion() && ts-W.waterT>700){ W.waterT=ts; W.waterF^=1; }
}
/* visible cone length: up to 3 tiles ahead, stopped by sight-blockers */
function coneLen(g){
  const [dx,dy]=DIRV[g.f];
  let n=0;
  for(let i=1;i<=3;i++){
    if(SIGHTBLOCK.has(tileAt(g.x+dx*i,g.y+dy*i))) break;
    n++;
  }
  return n;
}
function coneHits(g,px,py){
  const [dx,dy]=DIRV[g.f];
  const n=coneLen(g);
  for(let i=1;i<=n;i++) if(g.x+dx*i===px && g.y+dy*i===py) return true;
  return false;
}

/* ---------- draw ---------- */
function draw(ts){
  const cv=$("cv"), c=cv.getContext("2d");
  c.imageSmoothingEnabled=false;
  /* frame orchestration — follows the layer contract documented in
     src/world/rendering/worldRenderer.js */
  // layers 1–4 (+ static props + restricted tint): pre-baked terrain, one blit
  SWART.render.drawTerrain(c,W.waterF);
  // layer 3 (runtime): ambient decorations, then story-state props
  SWART.render.drawAmbient(c,ts,reducedMotion());
  if(S.flags.signal)
    SWART.render.drawTileSprite(c,"prop.clothesline.signal.m1",W.clothesline.x,W.clothesline.y);
  if(S.flags.dusk && S.obj==="dock"){
    const bx=8.4*TILE, by=13.9*TILE;
    c.drawImage(W.sprBoat,0,0,26,8,bx,by,52,16);
    c.drawImage(W.sprBrewsterN,0,0,16,16,bx+18,by-22,TILE,TILE);
  }
  // layer 5: characters, y-sorted (pooled slots — no allocation)
  let ai=0;
  for(let i=0;i<ENTS.length;i++){
    const e=ENTS[i], a=ACTORS[ai++];
    a.x=e.x*TILE; a.y=e.y*TILE; a.spr=W.sprNpc[e.id]; a.dz=e.dz||0;
  }
  for(let i=0;i<W.guards.length;i++){
    const g=W.guards[i], a=ACTORS[ai++];
    drawPosG(g); a.x=POS.x; a.y=POS.y; a.dz=0;
    a.spr=g.anim[DIR2C[g.f]][g.tw?g.sf:0];   // synchronized to tile movement, never free-running
  }
  { const a=ACTORS[ai++];
    drawPosP(); a.x=POS.x; a.y=POS.y; a.dz=0;
    a.spr=W.sprAnna[DIR2C[W.pf]][W.tw?W.stepFrame:0]; }
  SWART.render.drawActors(c,ACTORS);
  // layer 6: chimney smoke drifts above roofs and characters
  SWART.render.drawSmoke(c,ts,reducedMotion());
  // layer 7: night wash, then lantern halos
  if(S.flags.dusk){
    SWART.effects.drawDusk(c);
    for(let i=0;i<W.guards.length;i++){
      drawPosG(W.guards[i]);
      SWART.effects.drawLantern(c,POS.x,POS.y);
    }
  }
  // layer 8: sight cones (above characters so you can see the one you're in)
  for(let i=0;i<W.guards.length;i++){
    const g=W.guards[i], n=coneLen(g);
    if(!n) continue;
    drawPosG(g);
    SWART.cones.draw(c,POS.x,POS.y,DIR2C[g.f],n,SET.calm);
  }
  // layer 8.5: interaction marker above the faced target (talk / use /
  // locked) — slow sine bob, pinned still under reduced motion
  if(!anyModalOpen()){
    const ft=facedTarget();
    if(ft){
      const mid=ft.ent?"ui.marker.talk":(ft.tile==="V"?"ui.marker.locked":"ui.marker.interact");
      const bob=reducedMotion()?0:Math.round(Math.sin(ts/350)*2);
      const [mdx,mdy]=DIRV[W.pf];
      c.drawImage(SWART.registry.get(mid),0,0,8,8,
        (W.px+mdx)*TILE+8,(W.py+mdy)*TILE-12+bob,16,16);
    }
  }
  if(W.dbg){ SWART.render.drawDebugGrid(c,MW,MH,TILE); debugDraw(c); }
  updateLabel();   // layers 9–10 are DOM (labels, objective banner, HUD)
}
/* dev-only overlay (backtick): collision, restricted zone, triggers,
   patrol waypoints, entity anchors, and a live state readout.
   Never reachable during normal student play. */
function debugDraw(c){
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const ch=tileAt(x,y);
    if(BLOCK.has(ch)||SETAUKET.propBlocked(x,y)){          // collision = red
      c.fillStyle="rgba(255,60,60,.22)"; c.fillRect(x*TILE,y*TILE,TILE,TILE);
    }
    if(RESTRICT.has(ch)){                                  // restricted = orange edge
      c.strokeStyle="rgba(255,160,40,.7)"; c.strokeRect(x*TILE+1,y*TILE+1,TILE-2,TILE-2);
    }
  }
  c.strokeStyle="#00e0ff";                                 // trigger tiles = cyan
  for(let x=2;x<=14;x++) c.strokeRect(x*TILE+3,9*TILE+3,TILE-6,TILE-6);   // watch zone
  c.strokeRect(9*TILE+3,10*TILE+3,TILE-6,TILE-6);
  c.strokeRect(9*TILE+3,13*TILE+3,TILE-6,TILE-6);          // dock end (br1)
  ENTS.forEach(e=>{ c.strokeStyle="#40ff90"; c.strokeRect(e.x*TILE+2,e.y*TILE+2,TILE-4,TILE-4); });
  W.guards.forEach(g=>{                                    // waypoints = yellow dots
    c.fillStyle="#ffe14d";
    g.wp.forEach(([x,y])=>c.fillRect(x*TILE+13,y*TILE+13,6,6));
  });
  const lines=[
    "node:"+(S.node||"—")+"  obj:"+(S.obj||"—")+"  pos:"+W.px+","+W.py+" "+W.pf,
    "su:"+S.su+" tr:"+S.tr+" it:"+S.it+"  flags:"+Object.keys(S.flags).join(","),
    "guards:"+W.guards.map(g=>g.x+","+g.y+" i"+g.idx+" d"+g.dir+" cone"+coneLen(g)).join(" | "),
    "fired:"+S.map.fired.join(",")+"  noclip:"+W.noclip,
  ];
  c.fillStyle="rgba(10,14,20,.85)"; c.fillRect(2,2,636,12*lines.length+8);
  c.fillStyle="#e8e8e8"; c.font="10px monospace";
  lines.forEach((t,i)=>c.fillText(t,6,13+i*12));
}

/* position helpers write into the shared POS scratch — no per-frame allocs */
function lerpPos(a,ts){
  const k=reducedMotion()?1:Math.min(1,(ts-a.t0)/a.dur);
  POS.x=(a.fx+(a.tx-a.fx)*k)*TILE; POS.y=(a.fy+(a.ty-a.fy)*k)*TILE;
  return POS;
}
function drawPosP(){ if(W.tw) return lerpPos(W.tw,lastTs); POS.x=W.px*TILE; POS.y=W.py*TILE; return POS; }
function drawPosG(g){ if(g.tw) return lerpPos(g.tw,lastTs); POS.x=g.x*TILE; POS.y=g.y*TILE; return POS; }

/* ---------- floating label + interact button ---------- */
function updateLabel(){
  const t=facedTarget();
  let key="", text="", x=0, y=0;
  if(t){
    const [dx,dy]=DIRV[W.pf];
    x=W.px+dx; y=W.py+dy;
    if(t.ent){ key="e:"+t.ent.id; text=TT(t.ent.label); }
    else{ key="t:"+t.tile; text=TT(TILE_LABEL[t.tile]); }
  }
  $("btn-act").classList.toggle("ready",!!t);
  key+=":"+L();
  if(key===W.lastLabelKey && !W.dirtyLabels) return;
  W.lastLabelKey=key; W.dirtyLabels=false;
  const box=$("labels");
  if(!t){ box.innerHTML=""; return; }
  const sc=$("cv").clientWidth/640;
  // label floats above the marker glyph, which floats above the head —
  // neither may cover the face or the (off-canvas) objective banner
  box.innerHTML=`<div class="maplabel" style="left:${(x*TILE+16)*sc}px;top:${(y*TILE-14)*sc}px">${esc(text)}</div>`;
}

/* =====================================================================
   BOOT
   ===================================================================== */
window.addEventListener("beforeprint",()=>{ if($("s-debrief").hidden&&S.reports.length) showDebrief(); });
/* illustrated title cover (ILLUSTRATION_BIBLE §8) — embedded WebP; the
   game keeps working untouched if the manifest is ever absent */
if(typeof SWART!=="undefined" && SWART.illus && SWART.illus["illus.title-cover"]){
  const cov=SWART.illus["illus.title-cover"];
  $("s-title").classList.add("cover");
  $("s-title").style.backgroundImage="url('"+cov.data+"')";
  $("s-title").setAttribute("role","img");
  $("s-title").setAttribute("aria-label",TT(cov.alt));
}
setLang(S.lang);
updateHUD();
applySettings();
show("s-title");

</script>
