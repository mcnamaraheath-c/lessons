<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow War: The Culper Ring</title>
<style>
/* ============ SHADOW WAR — candlelight & ciphers ============ */
:root{
  --ink:#10161f;        /* deepest night */
  --ink2:#1a2332;       /* midnight blue-black */
  --ink3:#243247;       /* raised panels */
  --paper:#f2e8d5;      /* aged paper cream */
  --paper2:#e0d2b4;     /* darker paper */
  --paperink:#2b2418;   /* ink on paper */
  --amber:#e8a33d;      /* candle flame — the single accent */
  --amber2:#ffc46b;
  --crimson:#a83232;    /* BRITISH / DANGER ONLY */
  --muted:#9aa8bb;
  --ok:#7da87b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",Ubuntu,Cantarell,Arial,sans-serif;
  font-size:18px;line-height:1.5;
  background-image:radial-gradient(ellipse at 50% -10%, #243247 0%, #10161f 60%);
  min-height:100%;
}
button{font:inherit;cursor:pointer;min-height:44px;min-width:44px;border-radius:10px;border:2px solid var(--ink3);background:var(--ink3);color:var(--paper);padding:8px 16px}
button:hover{border-color:var(--amber)}
button:focus-visible, a:focus-visible, [tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--amber);border-color:var(--amber);color:#231a08;font-weight:700}
button.primary:hover{background:var(--amber2)}
button.ghost{background:transparent}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;letter-spacing:.06em}
[hidden]{display:none !important}
#app{max-width:1060px;margin:0 auto;padding:8px 10px 24px}

/* names & dates anchor styling */
b.nm{font-weight:800;color:var(--amber2);letter-spacing:.02em}
.dark b.nm{color:var(--amber2)}

/* vocab terms */
.vb{border-bottom:2px dotted var(--amber);cursor:pointer;background:none;border-top:none;border-left:none;border-right:none;color:inherit;font:inherit;padding:0;min-height:0;min-width:0;border-radius:2px}
.vb:hover{color:var(--amber2)}
.on-paper .vb{border-bottom-color:#8a6320}

/* ============ HUD ============ */
#hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 8px;background:var(--ink2);border:1px solid var(--ink3);border-radius:12px;margin-bottom:8px}
#hud .hud-title{font-family:Georgia,serif;letter-spacing:.1em;font-size:15px;color:var(--muted);white-space:nowrap}
.meters{display:flex;gap:14px;flex:1;flex-wrap:wrap;align-items:center}
.meter{display:flex;align-items:center;gap:6px;min-width:150px}
.meter svg{width:22px;height:22px;flex:none}
.meter .bar{position:relative;width:96px;height:14px;background:#0c111a;border-radius:7px;overflow:hidden;border:1px solid var(--ink3)}
.meter .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--amber);border-radius:7px;transition:width .4s}
body.rm .meter .bar i{transition:none}
.meter.susp .bar i{background:linear-gradient(90deg,var(--amber),var(--crimson))}
.meter.trust .bar i{background:var(--ok)}
.meter .lab{font-size:13px;color:var(--muted);white-space:nowrap}
.meter .val{font-size:13px;font-weight:700;min-width:26px;text-align:right}
#hud .hud-btns{display:flex;gap:6px}
#hud .hud-btns button{padding:6px 10px;font-size:15px}
#btn-lang b{color:var(--amber2)}

/* ============ SCREENS ============ */
.screen{animation:fadein .5s}
body.rm .screen{animation:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* Title */
#s-title{text-align:center;padding:40px 16px 30px}
/* illustrated cover (ILLUSTRATION_BIBLE §8): full-bleed art carries the
   branding; DOM h1 stays for screen readers; menu sits on a bottom scrim */
#s-title.cover{position:relative;overflow:hidden;border-radius:14px;min-height:min(86vh,560px);
  display:flex;flex-direction:column;justify-content:flex-end;
  background-size:cover;background-position:center top;padding:40px 16px 26px}
#s-title.cover::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(16,22,31,0) 45%,rgba(16,22,31,.55) 72%,rgba(16,22,31,.88) 100%)}
#s-title.cover .candle{display:none}
#s-title.cover h1{position:absolute;left:-9999px}      /* visually replaced by the art, kept for a11y */
#s-title.cover .menu,#s-title.cover .sub{position:relative;z-index:1}
#s-title.cover .sub{color:var(--paper);text-shadow:0 1px 4px rgba(0,0,0,.8);margin-bottom:14px}
#s-title.cover .menu .tiny{color:#c9d2de;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#s-title .candle{margin:0 auto 6px}
#s-title h1{font-size:clamp(30px,6vw,52px);color:var(--paper);letter-spacing:.12em}
#s-title h1 .amber{color:var(--amber)}
#s-title .sub{color:var(--muted);margin:8px 0 26px;font-size:19px}
#s-title .menu{display:flex;flex-direction:column;gap:12px;align-items:center}
#s-title .menu button{width:min(340px,90%);font-size:19px;padding:12px}
#code-entry{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
#code-entry input{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--ink3);background:#0c111a;color:var(--paper);width:min(300px,70vw);letter-spacing:.05em}
#code-entry input:focus-visible{outline:3px solid var(--amber)}
.tiny{font-size:14px;color:var(--muted)}

/* Character select */
#s-select h2{text-align:center;margin:10px 0 4px;font-size:26px}
#s-select .sub{text-align:center;color:var(--muted);margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card-ch{background:var(--ink2);border:2px solid var(--ink3);border-radius:14px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:8px;color:var(--paper)}
.card-ch:hover{border-color:var(--amber)}
.card-ch.locked{opacity:.62}
.card-ch svg{width:110px;height:110px;margin:0 auto;border-radius:50%;background:#0c111a;border:2px solid var(--ink3)}
.card-ch h3{font-size:20px}
.card-ch .hook{font-size:15px;color:var(--muted);min-height:44px}
.card-ch .stars{color:var(--amber);letter-spacing:3px}
.card-ch .true{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--ink3);padding-top:6px}
.badge{display:inline-block;background:var(--amber);color:#231a08;font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px;letter-spacing:.05em}

/* ============ MAP SCREEN ============ */
#objbar{display:flex;align-items:center;gap:8px;background:var(--ink2);border:1px solid var(--ink3);border-radius:10px;padding:4px 10px;margin-bottom:8px}
#objbar .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);flex:none}
#objtext{flex:1;font-size:17px}
#maparea{position:relative;width:fit-content;margin:0 auto;line-height:0}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border-radius:8px;border:2px solid var(--ink3);background:#000;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;line-height:1.2}
.maplabel{position:absolute;transform:translate(-50%,-100%);background:var(--paper);border:2px solid var(--ink);color:var(--paperink);font-weight:600;font-size:14px;padding:2px 9px;border-radius:8px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.4);animation:bob 1.2s ease-in-out infinite}
body.rm .maplabel{animation:none}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-5px}}
/* touch controls */
#dpad{position:absolute;left:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:2px;opacity:.85}
#dpad button{background:rgba(26,35,50,.8);border:1px solid var(--ink3);font-size:20px;border-radius:10px;padding:0;touch-action:none}
#dpad .blank{visibility:hidden}
#btn-act{position:absolute;right:12px;bottom:14px;width:76px;height:76px;border-radius:50%;font-size:26px;background:rgba(26,35,50,.85);border:2px solid var(--ink3);touch-action:none}
#btn-act.ready{border-color:var(--amber);background:rgba(232,163,61,.35);box-shadow:0 0 14px rgba(232,163,61,.5)}

/* ============ MODALS ============ */
.modal{position:fixed;inset:0;background:rgba(8,11,16,.55);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:10px}
.modal.center{align-items:center}
.modal .mcard{background:var(--ink2);border:2px solid var(--ink3);border-radius:16px;padding:18px 20px;width:min(720px,96vw);max-height:86vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:rise .25s}
body.rm .modal .mcard{animation:none}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.mcard.paper{background:var(--paper);color:var(--paperink);border-color:#b9a87f}
.mcard.dark{background:#0d1017;border-color:var(--crimson)}
.mcard .who{font-family:Georgia,serif;color:var(--amber);letter-spacing:.08em;font-size:15px;text-transform:uppercase;margin-bottom:6px}
.mcard.dark .who{color:var(--crimson)}
#dlg-text{font-size:19px;min-height:60px;margin-bottom:6px}
#dlg-text p{margin-bottom:10px}
.fx-toast{display:flex;align-items:center;gap:8px;background:#0c111a;border:1px solid var(--amber);border-radius:10px;padding:6px 12px;margin:8px 0;font-size:16px}
.fx-toast.bad{border-color:var(--crimson)}
.fx-toast svg{width:20px;height:20px;flex:none}
.dlg-actions{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.dlg-actions button{text-align:left;font-size:17.5px;padding:11px 14px;background:var(--ink3);border-color:#33455f}
.dlg-actions button.cont{text-align:center;background:var(--amber);color:#231a08;border-color:var(--amber);font-weight:700}
.dlg-topline{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.spk{flex:none;font-size:16px;padding:4px 10px;min-height:36px;min-width:44px;background:transparent;border:1px solid var(--ink3)}
.mcard.paper .spk{color:var(--paperink);border-color:#b9a87f}
.mcard.paper button{color:var(--paperink)}

/* vocab card */
#m-vocab .mcard{width:min(430px,94vw)}
#m-vocab .vword{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin-bottom:4px}
#m-vocab .vword svg{width:32px;height:32px}
#m-vocab .ves{color:var(--amber2);font-size:17px;margin-bottom:8px}
#m-vocab .vdef{font-size:17px}

/* code book side panel */
#m-book{justify-content:flex-end;align-items:stretch;padding:0}
#m-book .mcard{width:min(380px,92vw);max-height:none;height:100%;border-radius:16px 0 0 16px;background:var(--paper);color:var(--paperink);border:none;border-left:6px solid #8a6320;animation:slidein .3s}
body.rm #m-book .mcard{animation:none}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
#m-book h3{font-size:22px;border-bottom:2px solid #b9a87f;padding-bottom:6px;margin-bottom:8px}
.codelist{columns:1}
.coderow{display:flex;gap:10px;padding:5px 6px;border-radius:6px;font-size:17px;align-items:baseline}
.coderow:nth-child(odd){background:rgba(139,110,60,.12)}
.coderow b{font-family:Georgia,serif;color:#7a4a12;min-width:52px;font-size:18px}
.coderow.hot{background:var(--amber);color:#231a08}
.booknote{font-size:14px;color:#6b5b3e;margin-top:10px;font-style:italic}

/* puzzles */
#puzbox h3{margin-bottom:6px}
.puz-inst{font-size:17.5px;margin-bottom:12px}
.decode-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:20px;background:var(--paper);color:var(--paperink);border-radius:10px;padding:14px;font-family:Georgia,serif}
.chip{background:#2b2418;color:var(--paper);border:2px solid #7a4a12;border-radius:8px;padding:4px 10px;font-family:Georgia,serif;font-size:19px;min-height:40px}
.chip.done{background:var(--ok);color:#10240f;border-color:var(--ok);font-weight:700}
.chip-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip-opts button{font-size:18px}
.shake{animation:shake .3s}
body.rm .shake{animation:none}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* clothesline puzzle */
#linewrap{background:linear-gradient(#3a4b63,#2c3a4f);border-radius:12px;padding:10px 6px 4px;position:relative}
#lineslots{display:flex;justify-content:center;gap:6px;position:relative;padding:22px 4px 10px}
#lineslots::before{content:"";position:absolute;top:26px;left:2%;right:2%;height:3px;background:#c9b489;border-radius:2px}
.slot{width:58px;height:78px;border:2px dashed rgba(242,232,213,.35);border-radius:8px;background:transparent;padding:2px;position:relative}
.slot svg{width:100%;height:100%}
.slot.filled{border-style:solid;border-color:rgba(242,232,213,.6)}
.tray{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:stretch}
.tray button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;font-size:13.5px}
.tray button svg{width:40px;height:46px}
.tray button.sel{border-color:var(--amber);background:rgba(232,163,61,.2)}
.puz-foot{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.puz-msg{font-size:16px;color:var(--amber2);min-height:24px}

/* report builder */
.rb-step{margin-bottom:14px}
.rb-step h4{color:var(--amber);margin-bottom:6px;font-size:16px;letter-spacing:.05em;text-transform:uppercase}
.rb-claims,.rb-evid{display:flex;flex-direction:column;gap:8px}
.rb-claims button,.rb-evid button{text-align:left;font-size:16.5px}
.rb-claims button.sel,.rb-evid button.sel{border-color:var(--amber);background:rgba(232,163,61,.18)}
.rb-evid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:640px){.rb-evid{grid-template-columns:1fr}}
#rb-reason{width:100%;font:inherit;font-size:17px;background:#0c111a;color:var(--paper);border:2px solid var(--ink3);border-radius:10px;padding:10px;min-height:76px}
#rb-reason:focus-visible{outline:3px solid var(--amber)}

/* wax seal */
#sealwrap{text-align:center;padding:30px 0}
#sealwrap svg{width:130px;height:130px;animation:press .8s ease-out}
body.rm #sealwrap svg{animation:none}
@keyframes press{0%{transform:scale(2.4);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}

/* mission complete / debrief */
#s-done,#s-debrief{max-width:760px;margin:0 auto;padding:20px 4px}
.codebox{background:var(--paper);color:var(--paperink);font-family:Georgia,serif;font-size:20px;letter-spacing:.06em;border-radius:12px;padding:16px;word-break:break-all;text-align:center;border:2px solid #b9a87f;margin:12px 0}
.donerow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.debrief-block{background:var(--ink2);border:1px solid var(--ink3);border-radius:12px;padding:14px;margin-bottom:12px}
.debrief-block h4{color:var(--amber);margin-bottom:8px}
.debrief-block p{margin-bottom:6px}

/* pause / first-run */
.menu-list{display:flex;flex-direction:column;gap:10px}
.menu-list button{font-size:17px}
.toggle-on::after{content:" ✓";color:var(--amber)}
.fr-keys{display:flex;gap:8px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.key{background:#0c111a;border:2px solid var(--ink3);border-bottom-width:4px;border-radius:8px;padding:6px 12px;font-family:Georgia,serif;font-size:17px}

@media(max-width:700px){
  body{font-size:17px}
  #hud .hud-title{display:none}
  .meter{min-width:120px}
  .meter .bar{width:70px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
@media print{
  body{background:#fff;color:#000}
  body *{visibility:hidden}
  #s-debrief,#s-debrief *{visibility:visible}
  #s-debrief{position:absolute;left:0;top:0;width:100%}
  #s-debrief .no-print{display:none !important}
  .debrief-block{border:1px solid #999;color:#000;background:#fff}
  .debrief-block h4{color:#000}
}
</style>
</head>
<body>
<div id="app">

  <header id="hud" hidden aria-label="Status">
    <div class="hud-title">SHADOW WAR</div>
    <div class="meters">
      <div class="meter susp" title="Suspicion">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7z" fill="none" stroke="#e8a33d" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="#e8a33d"/></svg>
        <span class="lab" data-ui="susp">Suspicion</span>
        <span class="bar"><i id="bar-susp" style="width:0%"></i></span>
        <span class="val" id="val-susp">0</span>
      </div>
      <div class="meter trust" title="Trust">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l4-5h4l2 2h3l5 3-3 5-4-1-2 2-5-1-4-5z" fill="none" stroke="#7da87b" stroke-width="2" stroke-linejoin="round"/><path d="M11 8l-3 4 2 1 3-3" fill="none" stroke="#7da87b" stroke-width="2"/></svg>
        <span class="lab" data-ui="trust">Trust</span>
        <span class="bar"><i id="bar-trust" style="width:50%"></i></span>
        <span class="val" id="val-trust">50</span>
      </div>
      <div class="meter intel" title="Intel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="#e8a33d" stroke-width="2"/><path d="M3 8l9 6 9-6" fill="none" stroke="#e8a33d" stroke-width="2"/><circle cx="12" cy="14" r="2.6" fill="#a83232"/></svg>
        <span class="lab" data-ui="intel">Intel</span>
        <span class="val" id="val-intel" style="min-width:44px">0 / 10</span>
      </div>
    </div>
    <div class="hud-btns">
      <button id="btn-book" title="Code book">📖 <span data-ui="book">Code book</span></button>
      <button id="btn-lang" aria-label="Language English Spanish"></button>
      <button id="btn-pause" title="Menu" aria-label="Menu">☰</button>
    </div>
  </header>

  <main>
    <!-- ============ TITLE ============ -->
    <section id="s-title" class="screen">
      <svg class="candle" width="72" height="96" viewBox="0 0 36 48" aria-hidden="true">
        <ellipse cx="18" cy="14" rx="5" ry="9" fill="#e8a33d"/><ellipse cx="18" cy="16" rx="2.4" ry="5" fill="#fff0c9"/>
        <rect x="13" y="24" width="10" height="18" rx="2" fill="#f2e8d5"/><rect x="9" y="41" width="18" height="4" rx="2" fill="#8a6320"/>
        <line x1="18" y1="20" x2="18" y2="25" stroke="#4a3a1a" stroke-width="1.6"/>
      </svg>
      <h1>SHADOW <span class="amber">WAR</span></h1>
      <div class="sub" id="title-sub"></div>
      <div class="menu">
        <button class="primary" id="btn-new"></button>
        <button id="btn-resume-toggle"></button>
        <div id="code-entry" hidden>
          <label class="tiny" for="code-in" id="code-lab" style="width:100%"></label>
          <input id="code-in" autocomplete="off" spellcheck="false" placeholder="CR1....">
          <button id="btn-code-go"></button>
          <div class="tiny" id="code-err" role="alert"></div>
        </div>
        <div class="tiny" id="title-note"></div>
      </div>
    </section>

    <!-- ============ CHARACTER SELECT ============ -->
    <section id="s-select" class="screen" hidden>
      <h2 id="sel-h"></h2>
      <div class="sub" id="sel-sub"></div>
      <div class="cards" id="cards"></div>
    </section>

    <!-- ============ MAP ============ -->
    <section id="s-map" class="screen" hidden>
      <div id="objbar">
        <span class="dot" aria-hidden="true"></span>
        <span id="objtext" aria-live="polite"></span>
        <button class="spk" id="obj-spk" aria-label="Read aloud">🔊</button>
      </div>
      <div id="maparea">
        <canvas id="cv" width="640" height="480" tabindex="0" aria-label="Setauket town map. Use arrow keys to walk."></canvas>
        <div id="labels" aria-hidden="true"></div>
        <div id="dpad" hidden>
          <button class="blank" tabindex="-1"></button><button data-d="u" aria-label="Up">▲</button><button class="blank" tabindex="-1"></button>
          <button data-d="l" aria-label="Left">◀</button><button class="blank" tabindex="-1"></button><button data-d="r" aria-label="Right">▶</button>
          <button class="blank" tabindex="-1"></button><button data-d="d" aria-label="Down">▼</button><button class="blank" tabindex="-1"></button>
        </div>
        <button id="btn-act" hidden aria-label="Interact">✋</button>
      </div>
    </section>

    <!-- ============ MISSION COMPLETE ============ -->
    <section id="s-done" class="screen" hidden></section>

    <!-- ============ DEBRIEF ============ -->
    <section id="s-debrief" class="screen" hidden></section>
  </main>

  <!-- ============ DIALOGUE MODAL ============ -->
  <div id="m-dlg" class="modal" hidden role="dialog" aria-modal="true">
    <div class="mcard" id="dlg-card">
      <div class="dlg-topline">
        <div class="who" id="dlg-who"></div>

/* =====================================================================
   SHADOW WAR — pixel buffer utilities
   Source format: { width, height, pixels: number[height][width] }
   where each number is a palette index (0 = transparent).

   All conversion to canvases happens ONCE at init and is cached by the
   sprite registry — nothing in here may run per frame.
   ===================================================================== */
(function(NS){
"use strict";
const P=()=>NS.palette;

  /* ---------- construction ---------- */
  makeBuffer(width,height,fill){
    fill=fill|0;
    const pixels=new Array(height);
    for(let y=0;y<height;y++) pixels[y]=new Array(width).fill(fill);
    return {width,height,pixels};
  },

  /* Compact string-row authoring format:
     fromStrings([".XX.","X..X"], {".":0,"X":5}) — every row must be the
     same length and every character must appear in the char map. */
  fromStrings(rows,charMap){
    if(!Array.isArray(rows)||!rows.length) throw new Error("fromStrings: rows required");
    const width=rows[0].length, height=rows.length;
    const pixels=rows.map((row,y)=>{
      if(row.length!==width) throw new Error("fromStrings: row "+y+" length "+row.length+" != "+width);
      return [...row].map((ch,x)=>{
        if(!(ch in charMap)) throw new Error("fromStrings: unmapped char '"+ch+"' at "+x+","+y);
        return charMap[ch];
      });
    });
    return {width,height,pixels};
  },

  /* ---------- painting primitives (used by procedural generators) ---------- */
  rect(s,x,y,w,h,idx){
    const x0=Math.max(0,x), y0=Math.max(0,y);
    const x1=Math.min(s.width,x+w), y1=Math.min(s.height,y+h);
    for(let yy=y0;yy<y1;yy++){ const row=s.pixels[yy]; for(let xx=x0;xx<x1;xx++) row[xx]=idx; }
    return s;
  },
  dot(s,x,y,idx){
    if(x>=0&&y>=0&&x<s.width&&y<s.height) s.pixels[y][x]=idx;
    return s;
  },
  dots(s,list,idx){ list.forEach(([x,y])=>px.dot(s,x,y,idx)); return s; },

  /* ---------- transforms (return NEW buffers; sources stay immutable) ---------- */
  flipH(s){
    return {width:s.width,height:s.height,pixels:s.pixels.map(row=>row.slice().reverse())};
  },
  flipV(s){
    return {width:s.width,height:s.height,pixels:s.pixels.slice().reverse().map(r=>r.slice())};
  },
  /* swapPalette(sprite, {fromIndex: toIndex, ...}) — simple recolor for
     variants (e.g. one villager body, several coat colors). */
  swapPalette(s,mapping){
    return {width:s.width,height:s.height,
      pixels:s.pixels.map(row=>row.map(i=>(i in mapping)?mapping[i]:i))};
  },
  clone(s){ return {width:s.width,height:s.height,pixels:s.pixels.map(r=>r.slice())}; },

  /* ---------- validation ---------- */
  /* Returns [] when clean, else a list of human-readable problems. */
  validate(s,expect){
    const errs=[];
    if(!s||typeof s!=="object"){ return ["sprite is not an object"]; }
    if(!Number.isInteger(s.width)||!Number.isInteger(s.height)||s.width<1||s.height<1)
      errs.push("bad dimensions "+s.width+"x"+s.height);
    if(expect&&(s.width!==expect.width||s.height!==expect.height))
      errs.push("expected "+expect.width+"x"+expect.height+", got "+s.width+"x"+s.height);
    if(!Array.isArray(s.pixels)||s.pixels.length!==s.height){
      errs.push("pixels row count "+(s.pixels&&s.pixels.length)+" != height "+s.height);
      return errs;
    }
    s.pixels.forEach((row,y)=>{
      if(!Array.isArray(row)||row.length!==s.width){ errs.push("malformed row "+y); return; }
      row.forEach((i,x)=>{
        if(!P().isValidIndex(i)) errs.push("unknown palette index "+i+" at "+x+","+y);
      });
    });
    return errs;
  },
  isBlank(s){
    return s.pixels.every(row=>row.every(i=>i===0));
  },
  usedIndexes(s){
    const set=new Set();
    s.pixels.forEach(row=>row.forEach(i=>{ if(i!==0) set.add(i); }));
    return set;
  },

  /* Renders a buffer to an offscreen canvas at 1:1 source pixels. The
     renderer scales at blit time with imageSmoothingEnabled=false, which
     gives nearest-neighbor 16→32 scaling for free. */
  toCanvas(s,scale){
    scale=scale||1;
    const cv=document.createElement("canvas");
    cv.width=s.width*scale; cv.height=s.height*scale;
    const c=cv.getContext("2d");
    const colors=P().colors;
    for(let y=0;y<s.height;y++){
      const row=s.pixels[y];
      let x=0;
      while(x<s.width){
        const i=row[x];
        if(i===0){ x++; continue; }
        let run=1;                          // run-length fill: fewer fillRect calls
        while(x+run<s.width && row[x+run]===i) run++;
        c.fillStyle=colors[i];
        c.fillRect(x*scale,y*scale,run*scale,scale);
        x+=run;
      }
    }
    return cv;
  },
};

/* ---- src/world/art/spriteRegistry.js ---- */
/* =====================================================================
   SHADOW WAR — sprite registry
   Renderers never touch pixel data: they ask the registry for a cached
   offscreen canvas by ID ("tile.grass.0", "anna.walk.south.1", ...).

   Guarantees:
   - duplicate IDs are rejected at registration
   - structural validation runs once, at registration (cheap, init-time)
   - a missing ID returns a loud magenta fallback instead of crashing,
     and logs the ID once
   - canvases are rasterized lazily on first get() and cached forever
   ===================================================================== */
(function(NS){
"use strict";

const data={};      // id -> {sprite, meta}
const canvases={};  // id -> canvas (cache)
const anims={};     // groupId -> {facing: [frameId,...]}
const animCache={}; // groupId -> {facing: [canvas,...]}
const warnings=[];
const missingSeen=new Set();
let fallbackCanvas=null;

function warn(msg){
  warnings.push(msg);
  if(typeof console!=="undefined") console.warn("[SWART] "+msg);
}

function makeFallback(){
  if(fallbackCanvas) return fallbackCanvas;
  const cv=document.createElement("canvas");
  cv.width=cv.height=16;
  const c=cv.getContext("2d");
  for(let y=0;y<4;y++)for(let x=0;x<4;x++){
    c.fillStyle=((x+y)%2)?"#ff00ff":"#10161f";
    c.fillRect(x*4,y*4,4,4);

  fallbackCanvas=cv;
  return cv;

NS.registry={

  /* register(id, spriteBuffer, meta)
     meta: { kind:'tile'|'character'|'prop'|'effect',
             faction:'british'|'civilian'|null,
             expect:{width,height}?  — enforced size
             tags:[]? } */
  register(id,sprite,meta){
    if(data[id]) throw new Error("registry: duplicate id '"+id+"'");
    meta=meta||{};
    const errs=NS.px.validate(sprite,meta.expect);
    if(errs.length) throw new Error("registry: invalid sprite '"+id+"': "+errs.join("; "));
    data[id]={sprite,meta:{kind:meta.kind||"misc",faction:meta.faction||null,
      tags:meta.tags||[],width:sprite.width,height:sprite.height}};
    return id;
  },

  has(id){ return !!data[id]; },

  /* cached canvas for an id; loud fallback when missing */
  get(id){
    const cached=canvases[id];
    if(cached) return cached;
    const rec=data[id];
    if(!rec){
      if(!missingSeen.has(id)){ missingSeen.add(id); warn("missing sprite '"+id+"' — using fallback"); }
      return makeFallback();
    }
    return (canvases[id]=NS.px.toCanvas(rec.sprite));
  },
  getSprite(id){ return NS.registry.get(id); },   // conceptual alias

  /* the loud magenta checker shown for missing IDs — public so the
     asset preview can display it without triggering a warning */
  fallback(){ return makeFallback(); },

  /* raw source buffer (for tools/tests, not for rendering) */
  getData(id){ return data[id]?data[id].sprite:null; },
  meta(id){ return data[id]?data[id].meta:null; },
  list(){ return Object.keys(data); },
  getWarnings(){ return warnings.slice(); },

  /* ---------- animation groups ---------- */
  /* defineAnim("anna.walk", {south:["anna.walk.south.0",...], ...}) */
  defineAnim(groupId,facings){
    if(anims[groupId]) throw new Error("registry: duplicate anim group '"+groupId+"'");
    anims[groupId]=facings;
  },
  /* Resolved once and cached: {south:[canvas,canvas], ...}.
     Game code holds the returned object — frame lookup allocates nothing. */
  anim(groupId){
    const cached=animCache[groupId];
    if(cached) return cached;
    const def=anims[groupId];
    if(!def){ warn("missing anim group '"+groupId+"'"); return (animCache[groupId]={}); }
    const out={};
    for(const facing in def) out[facing]=def[facing].map(id=>NS.registry.get(id));
    return (animCache[groupId]=out);
  },
  animGroups(){ return Object.keys(anims); },

  /* ---------- audits (dev/test time; also run once at init) ---------- */
  /* British crimson may only appear in sprites tagged faction:'british'. */
  auditCrimson(){
    const bad=[];
    const reserved=NS.palette.BRITISH_ONLY;
    for(const id in data){
      const {sprite,meta}=data[id];
      if(meta.faction==="british") continue;
      if(meta.tags.includes("crimson-ok")) continue;   // explicitly British object (rare)
      const used=NS.px.usedIndexes(sprite);
      reserved.forEach(i=>{ if(used.has(i)) bad.push(id+" uses reserved '"+NS.palette.info[i].name+"'"); });
    }
    return bad;
  },
  auditBlank(){
    const bad=[];
    for(const id in data) if(NS.px.isBlank(data[id].sprite)) bad.push(id+" is fully transparent");
    return bad;
  },
  auditAnimFrames(){
    const bad=[];
    for(const g in anims){
      for(const facing in anims[g]){
        anims[g][facing].forEach(id=>{ if(!data[id]) bad.push("anim '"+g+"."+facing+"' references missing '"+id+"'"); });
        if(!anims[g][facing].length) bad.push("anim '"+g+"."+facing+"' has no frames");
      }
    }
    return bad;
  },
  validateAll(){
    const errors=[].concat(NS.registry.auditCrimson(), NS.registry.auditBlank(), NS.registry.auditAnimFrames());
    return {errors, warnings:warnings.slice(), count:Object.keys(data).length};
  },

  /* test hook — never used by game code */
  _resetForTests(){
    for(const k in data) delete data[k];
    for(const k in canvases) delete canvases[k];
    for(const k in anims) delete anims[k];
    for(const k in animCache) delete animCache[k];
    warnings.length=0; missingSeen.clear();
  },
};

/* ---- src/world/tiles/terrainTiles.js ---- */
/* =====================================================================
   SHADOW WAR — terrain tiles (ground the player walks on or past)
   16×16 source, blitted at 32×32.

   VARIANTS ARE DETERMINISTIC. Nothing picks a variant per frame:
   mapLegend.resolve() chooses by map position hash or by neighboring
   characters, so the same map always bakes the same picture.
   Speckle positions inside each tile are fixed for the same reason —
   repeated tiles must read as calm fields, not static noise.
   ===================================================================== */
(function(NS){
"use strict";
const {px,palette,registry}=NS;
const C=n=>palette.index(n);
const T=()=>px.makeBuffer(16,16,0);
const meta={kind:"tile",group:"terrain",expect:{width:16,height:16}};

/* ---------- shared painters (other tile modules build on these) ---------- */
function paintGrass(s){
  px.rect(s,0,0,16,16,C("grass-medium"));
  px.dots(s,[[2,3],[7,9],[12,5],[5,13],[10,1],[14,11],[1,8]],C("grass-dark"));
  px.dots(s,[[4,6],[11,12],[9,4]],C("grass-light"));
  return s;
}
function paintSand(s){
  px.rect(s,0,0,16,16,C("sand-medium"));
  px.dots(s,[[3,2],[8,7],[13,4],[5,11],[11,13],[1,9]],C("sand-dark"));
  return s;
}
function paintPath(s){
  px.rect(s,0,0,16,16,C("earth-medium"));
  px.dots(s,[[2,5],[9,2],[13,9],[6,12],[11,6]],C("earth-dark"));
  px.dots(s,[[4,9],[12,13]],C("earth-light"));
  return s;
}
function paintWater(s,off){
  px.rect(s,0,0,16,16,C("water-dark"));
  [[1,3],[9,4],[5,9],[12,11],[3,14]].forEach(([x,y])=>{
    px.rect(s,(x+off)%14,y,3,1,C("water-medium"));
  });
  return s;
}
NS.tilePaint={paintGrass,paintSand,paintPath,paintWater};

/* ---------- grass: 3 subtle variants, picked by (x*7+y*13)%3 ---------- */
registry.register("tile.grass.0",paintGrass(T()),meta);
const g1=T();
px.rect(g1,0,0,16,16,C("grass-medium"));
px.dots(g1,[[5,2],[11,8],[2,12],[14,5],[8,14],[1,4]],C("grass-dark"));
px.dots(g1,[[13,11],[3,9],[7,6]],C("grass-light"));
registry.register("tile.grass.1",g1,meta);
const g2=T();
px.rect(g2,0,0,16,16,C("grass-medium"));
px.dots(g2,[[9,3],[4,10],[14,13],[1,14],[12,1]],C("grass-dark"));
px.rect(g2,6,8,2,1,C("grass-light"));                 // one tiny sun patch
px.dots(g2,[[10,11]],C("grass-light"));
registry.register("tile.grass.2",g2,meta);

/* ---------- packed dirt (dooryards, well surround) ---------- */
const dirt=T();
px.rect(dirt,0,0,16,16,C("earth-medium"));
px.dots(dirt,[[2,2],[6,5],[11,3],[14,8],[4,11],[9,13],[13,14],[1,7],[7,9]],C("earth-dark"));
registry.register("tile.dirt.0",dirt,meta);

/* ---------- path with edge variants (see mapLegend.resolve) ----------
   .center = open crossing · .ns = north-south run (grass fringe E/W)
   .we = west-east run (grass fringe N/S) · .cross = 4-way junction   */
registry.register("tile.path.center",paintPath(T()),meta);
const pns=paintPath(T());
px.rect(pns,0,0,1,16,C("grass-medium")); px.rect(pns,15,0,1,16,C("grass-medium"));
px.dots(pns,[[0,4],[15,9],[0,12]],C("grass-dark"));
registry.register("tile.path.ns",pns,meta);
const pwe=paintPath(T());
px.rect(pwe,0,0,16,1,C("grass-medium")); px.rect(pwe,0,15,16,1,C("grass-medium"));
px.dots(pwe,[[3,0],[10,15],[13,0]],C("grass-dark"));
registry.register("tile.path.we",pwe,meta);
const pcross=paintPath(T());
px.dots(pcross,[[0,0],[15,0],[0,15],[15,15]],C("grass-medium"));   // soft corners
registry.register("tile.path.cross",pcross,meta);

/* ---------- shore: sand variants, restricted pebble sand, wet mud ---------- */
registry.register("tile.sand.0",paintSand(T()),meta);
const s1=T();
px.rect(s1,0,0,16,16,C("sand-medium"));
px.dots(s1,[[6,3],[12,9],[2,6],[9,12],[14,2],[4,14]],C("sand-dark"));
registry.register("tile.sand.1",s1,meta);
/* restricted ground: rougher, pebbled — reads "worked/watched" even in
   grayscale; the baked translucent zone tint goes on top of it */
const sr=paintSand(T());
px.dots(sr,[[4,4],[10,6],[7,11],[13,12],[2,13]],C("iron-band"));
px.dots(sr,[[5,5],[11,7]],C("stone-light"));
registry.register("tile.sand.restricted",sr,meta);
/* wet mud at the waterline */
const mud=T();
px.rect(mud,0,0,16,16,C("sand-dark"));
px.dots(mud,[[3,3],[9,6],[13,2],[6,10],[11,13],[1,12]],C("earth-dark"));
px.rect(mud,2,14,5,1,C("water-medium"));               // wet sheen streaks
px.rect(mud,10,15,4,1,C("water-medium"));
registry.register("tile.mud.0",mud,meta);

/* ---------- water: deep (2 frames) + shallow shoreline (2 frames) ---------- */
registry.register("tile.water.0",paintWater(T(),0),meta);
registry.register("tile.water.1",paintWater(T(),4),meta);
function shallow(off){
  const s=T();
  px.rect(s,0,0,16,16,C("water-medium"));
  [[2,2],[10,5],[5,10],[12,13]].forEach(([x,y])=>px.rect(s,(x+off)%13,y,3,1,C("water-light")));
  px.dots(s,[[4,6],[11,9],[7,14]],C("sand-dark"));     // seabed showing through
  return s;
}
registry.register("tile.water.shallow.0",shallow(0),meta);
registry.register("tile.water.shallow.1",shallow(5),meta);

/* ---------- worked ground ---------- */
/* tilled field (Woodhull's farm): furrow rows */
const soil=T();
px.rect(soil,0,0,16,16,C("earth-dark"));
for(let y=1;y<16;y+=3) px.rect(soil,0,y,16,1,C("earth-medium"));
px.dots(soil,[[4,3],[11,9],[7,12]],C("earth-light"));
registry.register("tile.soil.0",soil,meta);
/* kitchen garden (Anna's yard): furrows + young sprouts, tidier */
const garden=T();
px.rect(garden,0,0,16,16,C("earth-dark"));
for(let y=2;y<16;y+=4) px.rect(garden,0,y,16,1,C("earth-medium"));
px.dots(garden,[[3,3],[8,3],[13,3],[5,7],[10,7],[2,11],[7,11],[12,11],[4,15],[9,15]],C("grass-light"));
registry.register("tile.garden.0",garden,meta);

/* ---------- trees (blocking; silhouette must say "you cannot pass") ---------- */
const tree=paintGrass(T());
px.rect(tree,7,10,2,5,C("wood-dark"));
px.rect(tree,3,2,10,7,C("leaf-dark"));
px.rect(tree,5,0,6,3,C("leaf-dark"));
px.rect(tree,2,4,12,4,C("leaf-dark"));
[[4,3],[9,2],[6,6],[11,5]].forEach(([x,y])=>px.rect(tree,x,y,2,1,C("leaf-light")));
registry.register("tile.tree.0",tree,meta);
/* interior forest (every neighbor is also tree): solid canopy, no trunk —
   the border band reads as one mass instead of a picket of lollipops */
const deep=T();
px.rect(deep,0,0,16,16,C("leaf-dark"));
[[2,3],[8,1],[13,5],[5,8],[11,11],[1,13],[7,14]].forEach(([x,y])=>px.rect(deep,x,y,2,1,C("leaf-light")));
px.dots(deep,[[4,12],[14,9],[10,4]],C("outline-dark"));
registry.register("tile.tree.deep",deep,meta);

})(globalThis.SWART = globalThis.SWART || {});

/* ---- src/world/tiles/natureTiles.js ---- */
/* =====================================================================
   SHADOW WAR — natural barriers (all blocking except where noted)
   Rule from ART_BIBLE: blocking vegetation must not resemble walkable
   grass — every barrier here has a solid dark mass or built structure.
   ===================================================================== */
(function(NS){
"use strict";
const {px,palette,registry,tilePaint}=NS;
const C=n=>palette.index(n);
const T=()=>px.makeBuffer(16,16,0);
const meta={kind:"tile",group:"nature",expect:{width:16,height:16}};

/* low bush — blocking, but low: does NOT block guard sightlines */
const bush=tilePaint.paintGrass(T());

/* ---- src/world/characters/figureKit.js ---- */
/* =====================================================================
   SHADOW WAR — shared figure builder
   One parameterized 16×16 body so every villager reads as the same
   species of chunky pixel person. Facings: south/north/west/east.
   Frames: 0 (idle) and 1 (step). Skirted figures sway the hem; trousered
   figures alternate legs.

   SILHOUETTE FIRST (ART_BIBLE): at 16×16 identity comes from headwear,
   body shape, clothing color family, ONE accessory, and stance — never
   from facial detail. Faces are hair + two eye pixels, full stop.

   Frame discipline: feet always touch row 15, heads never rise above the
   hat's fixed rows, accessories keep the same anchor across frames — so
   there is no frame-to-frame size wobble (validated in tools/test-assets).

   opts (all palette indexes unless noted):
     coat, skirt(bool), skin, hair
     hat: tall|tricorn|straw|bonnet|cap|null · hatC · hatBrimC?
     vest: shirt sleeves show (arms use shirtC, default warm-cream)
     rolled: rolled sleeves (lower arms show skin) — working sailor look
     crossbelt: white military crossbelts (British kit)
     accessory: staff|stick|basket|rope|musket|musketL|haversack
   ===================================================================== */
(function(NS){
"use strict";
const {px,palette}=NS;
const C=n=>palette.index(n);

NS.buildFigure=function(o,facing,step){
  const s=px.makeBuffer(16,16,0);
  const R=(x,y,w,h,i)=>px.rect(s,x,y,w,h,i);
  const eye=C("outline-dark"), boot=C("boot-dark");
  // head + face
  R(5,3,6,4,o.skin);
  if(facing==="north"){ R(5,3,6,4,o.hair); }
  else{
    R(5,3,6,1,o.hair);
    if(facing==="south"){ R(6,5,1,1,eye); R(9,5,1,1,eye); }
    if(facing==="west"){ R(6,5,1,1,eye); }
    if(facing==="east"){ R(9,5,1,1,eye); }
  }
  // hats — the silhouette layer (tall hat is BRITISH ONLY by convention)
  if(o.hat==="tall"){    R(5,0,6,3,o.hatC); R(5,2,6,1,C("iron-band")); R(4,3,8,1,o.hatC); }
  if(o.hat==="tricorn"){ R(5,1,6,2,o.hatC); R(3,3,10,1,o.hatC); }
  if(o.hat==="straw"){   R(5,1,6,2,o.hatC); R(3,3,10,1,o.hatBrimC!==undefined?o.hatBrimC:o.hatC); }
  if(o.hat==="bonnet"){  R(4,1,8,3,o.hatC); R(4,4,1,2,o.hatC); R(11,4,1,2,o.hatC); }
  if(o.hat==="cap"){     R(5,1,6,2,o.hatC); }
  // body
  const armC = o.vest ? (o.shirtC!==undefined?o.shirtC:C("warm-cream")) : o.coat;
  if(o.skirt){
    R(5,7,6,3,o.coat);
    R(4,7,1,3,armC); R(11,7,1,3,armC);                  // arms
    R(4,10,8,3,o.coat);
    const sway=step?(facing==="west"?-1:1):0;
    R(3+sway,13,10,2,o.coat);                           // hem
    R(5,15,2,1,boot); R(9,15,2,1,boot);                 // shoes peek (row 15)
    R(6,8,4,2,C("warm-cream"));                         // apron front
  }else{
    R(5,7,6,5,o.coat);
    R(4,7,1,4,armC); R(11,7,1,4,armC);
    if(o.rolled){ R(4,9,1,2,o.skin); R(11,9,1,2,o.skin); }   // rolled sleeves
    if(o.crossbelt){ R(5,7,1,4,C("white-crossbelt")); R(10,7,1,4,C("white-crossbelt")); }
    const la=step?1:0, lb=step?0:1;
    R(5,12+la,2,3-la,boot); R(9,12+lb,2,3-lb,boot);
    R(5,15,2,1,boot); R(9,15,2,1,boot);                 // feet planted (row 15)
  }
  // identifying accessories — same anchors in both frames of a facing
  // (usually ONE per figure; guards pair musket + haversack)
  const accs=Array.isArray(o.accessory)?o.accessory:(o.accessory?[o.accessory]:[]);
  accs.forEach(acc=>{
    if(acc==="staff"){                                  // tall walking staff
      const x=facing==="west"?2:13;
      R(x,3,1,12,C("wood-light")); R(x,3,1,1,C("wood-medium"));
    }
    if(acc==="stick"){                                  // elder's cane
      const x=facing==="west"?2:13;
      R(x,8,1,7,C("wood-medium")); R(x,8,1,1,C("wood-dark"));
    }
    if(acc==="basket"){                                 // market basket at the hip
      R(2,10,3,3,C("sand-medium")); R(2,10,3,1,C("earth-light"));
    }
    if(acc==="rope"){                                   // boatman's rope coil
      R(11,10,3,3,C("sand-medium")); px.dot(s,12,11,C("earth-dark"));
    }
    if(acc==="musket"||acc==="musketL"){                // shouldered musket
      const x=acc==="musketL"?1:14;
      R(x,1,1,7,C("iron-band"));                        // barrel above the shoulder
      R(x,8,1,6,C("wood-dark"));                        // stock
    }
    if(acc==="haversack"){                              // white canvas haversack
      R(11,9,3,4,C("paper-cream")); px.dot(s,11,9,C("sand-dark"));
    }
  });
  return s;
};

const FACINGS=["south","north","west","east"];
NS.FACINGS=FACINGS;

/* register a 4-facing × 2-frame walk set + its animation group */
NS.registerWalkSet=function(groupId,opts,meta){
  const facings={};
  FACINGS.forEach(f=>{
    facings[f]=[0,1].map(step=>{
      const id=groupId+"."+f+"."+step;
      NS.registry.register(id,NS.buildFigure(opts,f,step),
        Object.assign({kind:"character",group:"characters",expect:{width:16,height:16}},meta));
      return id;
    });
  });
  NS.registry.defineAnim(groupId,facings);
};

/* register a 4-facing idle set (one frame per facing) —
   ids: <groupId>.idle.<facing>, anim group: <groupId>.idle */
NS.registerIdleSet=function(groupId,opts,meta){
  const facings={};
  FACINGS.forEach(f=>{
    const id=groupId+".idle."+f;
    NS.registry.register(id,NS.buildFigure(opts,f,0),
      Object.assign({kind:"character",group:"characters",expect:{width:16,height:16}},meta));
    facings[f]=[id];
  });
  NS.registry.defineAnim(groupId+".idle",facings);
};

/* single idle facing (kept for special cases) */
NS.registerIdle=function(id,opts,facing,meta){
  NS.registry.register(id,NS.buildFigure(opts,facing,0),
    Object.assign({kind:"character",group:"characters",expect:{width:16,height:16}},meta));
};

})(globalThis.SWART = globalThis.SWART || {});

/* =====================================================================
   SHADOW WAR — guard sight cones
   The rule the student must SEE: 3 tiles straight ahead, a soft crimson
   wedge. Wedge canvases are pre-rendered per (direction × length × calm)
   — max 24 small canvases — and blitted per frame. No per-frame paths.

   Geometry matches the shipped pilot exactly: from the guard's front
   edge (10px out) widening from ±5px to ±17px at the far end.
   ===================================================================== */

"use strict";
const TILE=32;
const cache={};

function buildCone(dir,len,calm){
  const far=len*TILE;
  const cv=document.createElement("canvas");
  const horiz=(dir==="east"||dir==="west");
  cv.width = horiz?far:34;
  cv.height= horiz?34:far;
  const c=cv.getContext("2d");
  c.globalAlpha=calm?0.13:0.20;
  c.fillStyle="#a83232";               // palette: sight-cone-tint base hue
  c.beginPath();
  if(dir==="east"){ c.moveTo(0,12); c.lineTo(far,0); c.lineTo(far,34); c.lineTo(0,22); }
  if(dir==="west"){ c.moveTo(far,12); c.lineTo(0,0); c.lineTo(0,34); c.lineTo(far,22); }
  if(dir==="south"){ c.moveTo(12,0); c.lineTo(0,far); c.lineTo(34,far); c.lineTo(22,0); }
  if(dir==="north"){ c.moveTo(12,far); c.lineTo(0,0); c.lineTo(34,0); c.lineTo(22,far); }

/* =====================================================================

   Maps ASCII characters to sprites and physics flags. This file owns
   VISUAL + PHYSICS meaning only. Bilingual labels, node hookups, and
   trigger logic live in the game script (story layer) — keep them there.

   CHARACTER KEY (keep the ASCII map readable):
     .  grass          d  dirt path       ~  shore sand      W  water
     g  tilled field   q  kitchen garden  e  packed dirt     b/B dock
     T  tree           u  bush            r  shore rocks     s  stone wall
     K L / k l         the great oak (2×2: canopy row / trunk row)
     H  clapboard wall n  window (light)  A  Anna's door     M  chimney roof
     x  dark boards    y  window (dark)   V  tavern door     h  roof
     Z  barn roof      z  barn wall       D  barn door       f  fence
     =  open gate (WALKABLE)              P  rope post       o  well
     C  clothesline

   DETERMINISTIC VARIANT RULES — resolve(map,x,y,waterFrame):
   Nothing is random and nothing changes between frames except the two
   water frames. The same map string always bakes the same picture.
     grass '.'  -> tile.grass.{(x*7+y*13)%3}
     path  'd'  -> by path-neighbor mask: N/S only -> tile.path.ns,
                   E/W only -> tile.path.we, both axes -> tile.path.cross,
                   isolated -> tile.path.center

                   (wet waterline), else tile.sand.restricted (the whole

                   sand/dock/rocks, else deep tile.water.{f}

const FIXED={

  "g":{sprite:"tile.soil.0"},
  "q":{sprite:"tile.garden.0"},
  "b":{sprite:"tile.dock.0"},
  "B":{sprite:"tile.dock.0"},                        // dock end (trigger tile)
  "u":{sprite:"tile.bush.0"},
  "r":{sprite:"tile.rocks.0"},
  "s":{sprite:"tile.wall.stone"},
  "K":{sprite:"tile.oak.nw"},"L":{sprite:"tile.oak.ne"},
  "k":{sprite:"tile.oak.sw"},"l":{sprite:"tile.oak.se"},
  "H":{sprite:"tile.house.wall"},
  "n":{sprite:"tile.house.window"},
  "A":{sprite:"tile.door.house"},
  "x":{sprite:"tile.house.wall.dark"},
  "y":{sprite:"tile.house.window.dark"},
  "V":{sprite:"tile.door.tavern"},
  "h":{sprite:"tile.roof.0"},
  "M":{sprite:"tile.roof.chimney"},
  "Z":{sprite:"tile.barn.roof"},
  "z":{sprite:"tile.barn.wall"},
  "D":{sprite:"tile.barn.door"},
  "f":{sprite:"tile.fence.0"},
  "=":{sprite:"tile.fence.gate"},
  "P":{sprite:"tile.post.0"},
  "o":{sprite:"tile.well.0"},
  "C":{sprite:"prop.clothesline.empty"},
  /* variant families listed for completeness/preview; resolve() picks */
  ".":{sprite:"tile.grass.0"},
  "d":{sprite:"tile.path.center"},
  "~":{sprite:"tile.sand.restricted"},
  "W":{frames:["tile.water.0","tile.water.1"]},

  const ch=at(map,x,y);
  switch(ch){
    case ".": return "tile.grass."+((x*7+y*13)%3);
    case "d":{
      const ns=(at(map,x,y-1)==="d")||(at(map,x,y+1)==="d");
      const we=(at(map,x-1,y)==="d")||(at(map,x+1,y)==="d");
      if(ns&&we) return "tile.path.cross";
      if(ns) return "tile.path.ns";
      if(we) return "tile.path.we";
      return "tile.path.center";

    case "~": return at(map,x,y+1)==="W" ? "tile.mud.0" : "tile.sand.restricted";
    case "W":{

    }
    case "T":{

                 at(map,x-1,y)==="T"&&at(map,x+1,y)==="T";

  html+='<h3 style="color:#e8a33d;margin:14px 0 4px">palette ('+NS.palette.size+')</h3>'+
    '<table style="border-collapse:collapse">'+
    NS.palette.info.map(p=>'<tr>'+
      '<td style="padding:1px 8px">'+p.index+'</td>'+
      '<td><span style="display:inline-block;width:28px;height:14px;border:1px solid #555;'+
        'background:'+(p.css||"transparent")+'"></span></td>'+
      '<td style="padding:1px 8px">'+esc(p.name)+'</td>'+
      '<td style="padding:1px 8px;color:#9aa8bb">'+esc(p.css||"—")+'</td>'+
      '<td style="padding:1px 8px;color:#8090a5">'+esc(p.use)+'</td></tr>').join("")+"</table>";

  // sprites grouped by meta.group (terrain / nature / structures /
  // landmarks / dock / ambient / …), falling back to kind
  const GROUP_ORDER=["terrain","nature","structures","landmarks","dock","ambient","character","effect","tile","prop","misc"];
  const byKind={};
  NS.registry.list().forEach(id=>{
    const m=NS.registry.meta(id);
    const k=m.group||m.kind;
    (byKind[k]=byKind[k]||[]).push(id);
  });
  const groups=Object.keys(byKind).sort((a,b)=>{
    const ia=GROUP_ORDER.indexOf(a), ib=GROUP_ORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b);
  });
  for(const kind of groups){
    html+='<h3 style="color:#e8a33d;margin:14px 0 4px">'+esc(kind)+' ('+byKind[kind].length+')</h3>'+
      '<div style="display:flex;flex-wrap:wrap;gap:10px">'+
      byKind[kind].sort().map(id=>{
        const m=NS.registry.meta(id);
        return '<figure style="margin:0;text-align:center">'+
          '<span class="swart-spr" data-id="'+esc(id)+'" style="display:inline-block;'+
            'width:'+(m.width*3)+'px;height:'+(m.height*3)+'px;background:#243247"></span>'+
          '<figcaption style="max-width:110px;color:#9aa8bb;font-size:11px">'+esc(id)+
          '<br>'+m.width+"×"+m.height+(m.faction?"<br>"+esc(m.faction):"")+'</figcaption></figure>';
      }).join("")+"</div>";
  }

  // animation groups (live, with a reduced-motion preview toggle)
  const animGroups=NS.registry.animGroups();
  if(animGroups.length){
    html+='<h3 style="color:#e8a33d;margin:14px 0 4px">animations ('+animGroups.length+')</h3>'+
      '<label style="display:block;margin-bottom:8px;color:#9aa8bb">'+
      '<input type="checkbox" id="swart-rm"> reduced-motion preview (frame 0 only)</label>'+
      '<div style="display:flex;flex-wrap:wrap;gap:14px">'+
      animGroups.map(g=>'<figure style="margin:0;text-align:center">'+
        '<span class="swart-anim" data-g="'+esc(g)+'" style="display:inline-block;width:48px;height:48px;background:#243247"></span>'+
        '<figcaption style="color:#9aa8bb;font-size:11px">'+esc(g)+'</figcaption></figure>').join("")+"</div>";
  }
  // characters in context: key sprites over grass / path / dock / shore
  const CTX_BGS=["tile.grass.0","tile.path.center","tile.dock.0","tile.sand.restricted"];
  const CTX_SPRITES=["anna.walk.south.0","guard.walk.south.0","guard.b.walk.south.0",
    "npc.abraham.idle.west","npc.widow.idle.east","npc.oldman.idle.west",
    "npc.jonah.idle.south","npc.brewster.idle.south","npc.youth.idle.south"];
  html+='<h3 style="color:#e8a33d;margin:14px 0 4px">characters in context (readability check)</h3>'+
    '<div style="display:flex;flex-wrap:wrap;gap:10px">'+
    CTX_SPRITES.map(id=>'<figure style="margin:0;text-align:center">'+
      '<span class="swart-ctx" data-id="'+esc(id)+'"></span>'+
      '<figcaption style="max-width:132px;color:#9aa8bb;font-size:11px">'+esc(id)+'</figcaption></figure>').join("")+"</div>";
  // floating-label samples over the same backgrounds
  html+='<h3 style="color:#e8a33d;margin:14px 0 4px">interaction labels over terrain</h3>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
    CTX_BGS.map(bg=>'<span class="swart-lbl" data-bg="'+esc(bg)+'" style="position:relative;display:inline-block;width:96px;height:64px">'+
      '<span style="position:absolute;left:50%;top:18px;transform:translate(-50%,-100%);background:#f2e8d5;'+
      'border:2px solid #10161f;color:#2b2418;font-weight:600;font-size:12px;padding:1px 7px;border-radius:7px;white-space:nowrap">Tendedero</span></span>').join("")+"</div>";
  // the missing-sprite fallback, so everyone knows what "broken" looks like
  html+='<h3 style="color:#e8a33d;margin:14px 0 4px">missing-sprite fallback</h3>'+
    '<figure style="margin:0;text-align:center;display:inline-block">'+
    '<span id="swart-fallback"></span>'+
    '<figcaption style="color:#9aa8bb;font-size:11px">what an unregistered ID renders as</figcaption></figure>';
  panel.innerHTML=html;
  document.body.appendChild(panel);

  // paint context strips (sprite composited over each background tile)
  panel.querySelectorAll(".swart-ctx").forEach(el=>{
    const id=el.dataset.id;
    CTX_BGS.forEach(bg=>{
      const cv=document.createElement("canvas"); cv.width=cv.height=32;
      cv.style.margin="0 1px";
      const c=cv.getContext("2d"); c.imageSmoothingEnabled=false;
      c.drawImage(NS.registry.get(bg),0,0,16,16,0,0,32,32);
      c.drawImage(NS.registry.get(id),0,0,16,16,0,-4,32,32);
      el.appendChild(cv);
    });
  });
  // label sample backgrounds
  panel.querySelectorAll(".swart-lbl").forEach(el=>{
    const cv=document.createElement("canvas"); cv.width=96; cv.height=64;
    cv.style.cssText="position:absolute;inset:0";
    const c=cv.getContext("2d"); c.imageSmoothingEnabled=false;
    for(let x=0;x<3;x++)for(let y=0;y<2;y++)
      c.drawImage(NS.registry.get(el.dataset.bg),0,0,16,16,x*32,y*32,32,32);
    el.insertBefore(cv,el.firstChild);
  });
  // fallback checker
  { const cv=document.createElement("canvas"); cv.width=cv.height=48;
    const c=cv.getContext("2d"); c.imageSmoothingEnabled=false;
    c.drawImage(NS.registry.fallback(),0,0,16,16,0,0,48,48);
    panel.querySelector("#swart-fallback").appendChild(cv); }
  // grayscale preview: one CSS filter covers palette, sprites, and labels
  panel.querySelector("#swart-gray").addEventListener("change",e=>{
    panel.style.filter=e.target.checked?"grayscale(1)":"";
  });

  // paint sprite thumbnails (scaled 3×, nearest neighbor)
  panel.querySelectorAll(".swart-spr").forEach(el=>{
    const id=el.dataset.id, m=NS.registry.meta(id);
    const cv=document.createElement("canvas");
    cv.width=m.width*3; cv.height=m.height*3;
    const c=cv.getContext("2d");
    c.imageSmoothingEnabled=false;
    c.drawImage(NS.registry.get(id),0,0,m.width,m.height,0,0,cv.width,cv.height);
    el.appendChild(cv);
  });
  // animation players: cycle facings and frames
  const players=[...panel.querySelectorAll(".swart-anim")].map(el=>{
    const cv=document.createElement("canvas"); cv.width=cv.height=48;
    el.appendChild(cv);
    return {g:el.dataset.g, c:cv.getContext("2d")};
  });
  const FACING_CYCLE=["south","west","north","east"];
  let tick=0;
  animTimer=setInterval(()=>{
    const rm=panel.querySelector("#swart-rm");
    const frozen=rm&&rm.checked;
    if(!frozen) tick++;
    players.forEach(p=>{
      const anim=NS.registry.anim(p.g);
      const facing=FACING_CYCLE[(tick>>2)%4];
      const frames=anim[facing]||anim[Object.keys(anim)[0]];
      if(!frames||!frames.length) return;
      p.c.imageSmoothingEnabled=false;
      p.c.clearRect(0,0,48,48);
      p.c.drawImage(frames[frozen?0:tick%frames.length],0,0,16,16,0,0,48,48);
    });
  },240);
  panel.querySelector("#swart-preview-close").addEventListener("click",NS.preview.close);
}

NS.preview={
  open(){ if(!panel) build(); panel.style.display="block"; },
  close(){
    if(animTimer){ clearInterval(animTimer); animTimer=null; }
    if(panel){ panel.remove(); panel=null; }
  },
  isOpen(){ return !!panel; },
};

/* =====================================================================
   SHADOW WAR — world asset init
   Called once by the game before the first map frame. All pixel-data →
   canvas conversion happens here; nothing converts per frame.
   ===================================================================== */
(function(NS){
"use strict";
let done=false;

NS.TILE=32;

NS.init=function(){
  if(done) return NS;
  done=true;
  // bake the static map (terrain + structures + restricted tint), both water frames
  NS.render.buildTerrain(NS.maps.setauket,NS.legend);
  // warm the character/prop canvas caches so first draw doesn't hitch
  NS.registry.list().forEach(id=>NS.registry.get(id));
  // one full audit at load; problems are console warnings, never crashes
  const report=NS.registry.validateAll();
  if(report.errors.length && typeof console!=="undefined")
    console.warn("[SWART] asset audit:",report.errors);
  return NS;
};

})(globalThis.SWART = globalThis.SWART || {});

const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let PUZ=null;          // active puzzle {rerender, resume}

/* storage can be disabled on managed Chromebooks — never touch localStorage directly */
const LS={
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
};
const SET_KEY="culper_set", AUTO_KEY="culper_auto";
let SET={calm:false, rm:null, touch:null};
try{ Object.assign(SET, JSON.parse(LS.get(SET_KEY)||"{}")); }catch(e){}

function saveSet(){ LS.set(SET_KEY,JSON.stringify(SET)); }
function reducedMotion(){ return SET.rm===null ? matchMedia("(prefers-reduced-motion: reduce)").matches : SET.rm; }
function touchUI(){ return SET.touch===null ? (matchMedia("(pointer: coarse)").matches || "ontouchstart" in window) : SET.touch; }
function applySettings(){
  document.body.classList.toggle("rm", reducedMotion());
  $("dpad").hidden = !touchUI() || $("s-map").hidden;
  $("btn-act").hidden = !touchUI() || $("s-map").hidden;
}

function newState(){
  INT.on=false;
  return {v:1, lang:(S&&S.lang)||LS.get("culper_lang")||"en",

}

/* ---------- text markup ---------- */
function vbBtn(k,disp){ const v=VOCAB[k]; if(!v) return disp; return `<button class="vb" data-k="${k}">${disp}</button>`; }
function fmt(s){
  return esc(s)
    .replace(/\{\{(.+?)\}\}/g,'<b class="nm">$1</b>')
    .replace(/\[\[(\w+)\|(.+?)\]\]/g,(m,k,d)=>vbBtn(k,d))
    .replace(/\[\[(\w+)\]\]/g,(m,k)=>vbBtn(k, VOCAB[k]?VOCAB[k].w[L()]:k));
}
function plain(s){ const d=document.createElement("div"); d.innerHTML=fmt(s); return d.textContent; }

/* ---------- read aloud ---------- */
function say(text){
  if(!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang = L()==="es" ? "es-US" : "en-US";
    u.rate=0.95;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- HUD ---------- */
function updateHUD(){
  $("bar-susp").style.width=S.su+"%";
  $("val-susp").textContent=S.su;
  $("bar-trust").style.width=S.tr+"%";
  $("val-trust").textContent=S.tr;
  $("val-intel").textContent=S.it+" / 10";
}
const TOASTSVG={
  s:'<svg viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>',
  tr:'<svg viewBox="0 0 24 24"><path d="M3 13l4-5h4l2 2h3l5 3-3 5-4-1-2 2-5-1-4-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  i:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 8l9 6 9-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
};
function applyFx(fx){
  if(!fx) return null;
  let bad=false, icon="i";
  if(fx.sSet!==undefined){ S.su=Math.max(0,Math.min(100,fx.sSet)); icon="s"; INT.on=false; }
  if(fx.s){ S.su=Math.max(0,Math.min(100,S.su+fx.s)); icon="s"; if(fx.s>0) bad=true; }
  if(fx.s===0){ icon="s"; }
  if(fx.tr){ S.tr=Math.max(0,Math.min(100,S.tr+fx.tr)); if(!fx.s&&fx.sSet===undefined) icon="tr"; if(fx.tr<0) bad=true; }
  if(fx.i){ S.it=Math.max(0,Math.min(10,S.it+fx.i)); if(!fx.s&&fx.sSet===undefined&&!fx.tr) icon="i"; }
  updateHUD();
  if(!fx.note) return null;
  return {html:`<div class="fx-toast ${bad?"bad":""}" style="color:${bad?"var(--crimson)":"var(--amber)"}">${TOASTSVG[icon]}<span style="color:var(--paper)">${esc(TT(fx.note))}</span></div>`};
}

/* ---------- dialogue ---------- */
const dlg={id:null, ci:0, toast:null};
function chunksOf(n){ const t=TT(n.t); return Array.isArray(t)?t:[t]; }

function go(id){
  const n=NODES[id];
  if(!n){ console.warn("missing node",id); return; }
  S.node=id;
  if(n.set) Object.assign(S.flags,n.set);
  if(n.obj) setObj(n.obj);
  if(n.fx) dlg.toast=applyFx(n.fx);
  if(n.puzzle){ closeDlg(); startPuzzle(n.puzzle, ()=>{ if(n.go) go(n.go); }); autoSave(); return; }
  dlg.id=id; dlg.ci=0;
  renderDlg();
  autoSave();
}
function renderDlg(){
  const n=NODES[dlg.id]; if(!n) return;
  const card=$("dlg-card");
  card.classList.toggle("dark",!!n.dark);
  $("dlg-who").textContent=TT(n.who)||"";
  $("dlg-toast").innerHTML = dlg.toast ? dlg.toast.html : "";
  const chunks=chunksOf(n);
  $("dlg-text").innerHTML="<p>"+fmt(chunks[dlg.ci])+"</p>";
  const acts=$("dlg-actions"); acts.innerHTML="";
  const last = dlg.ci>=chunks.length-1;
  if(!last){
    addBtn(acts,TT(UI.cont),"cont",()=>{ dlg.ci++; dlg.toast=null; renderDlg(); });
  }else if(n.ch){
    n.ch.forEach((c,i)=>{
      addBtn(acts,plain(TT(c.t)),"",()=>{
        S.choices.push({n:dlg.id,i});
        if(c.set) Object.assign(S.flags,c.set);
        dlg.toast=applyFx(c.fx);
        if(S.su>=100 && !INT.on){ INT.on=true; go("int1"); }
        else go(c.next);
      });
    });
  }else{
    addBtn(acts,TT(UI.cont),"cont",()=>{
      dlg.toast=null;
      if(n.go){ go(n.go); }
      else if(n.end){ finishNode(n); }
      else closeDlg();
    });
  }
  openModal("m-dlg");
  const first=acts.querySelector("button"); if(first) first.focus();
}
function finishNode(n){
  closeDlg();
  switch(n.end){
    case "map": resumeMap(); break;
    case "firstrun": startMission1(); break;
    case "report": startReport(); break;
    case "complete": showDone(); break;
    case "puzzle_resume": if(PUZ&&PUZ.resume) PUZ.resume(); break;
  }
  autoSave();
}
function addBtn(parent,label,cls,fn){
  const b=document.createElement("button");
  if(cls) b.className=cls;
  b.textContent=label;
  b.addEventListener("click",fn);
  parent.appendChild(b);
  return b;
}
function closeDlg(){ $("m-dlg").hidden=true; dlg.id=null; }

}

/* ---------- save codes ---------- */
function makeCode(){
  // snapshot guard patrol phase (addendum §8) so a mid-map resume puts
  // the patrol back where the student left it
  if(typeof W!=="undefined" && W.init && W.on)
    S.map.g=W.guards.map(g=>[g.x,g.y,g.idx,g.dir]);
  const d={l:S.lang,ch:S.ch,sc:S.scene,n:S.node,su:S.su,tr:S.tr,it:S.it,
    f:S.flags,o:S.obj,h:S.hints,c:S.choices,r:S.reports,m:S.map,d1:S.m1done};
  return "CR1."+btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/=+$/,"");
}
function loadCode(str){
  str=(str||"").trim();
  if(!str.startsWith("CR1.")) return false;
  let d;
  try{ d=JSON.parse(decodeURIComponent(escape(atob(str.slice(4))))); }catch(e){ return false; }
  if(!d||!d.sc) return false;
  S=newState();
  S.lang=d.l||S.lang; S.ch=d.ch; S.scene=d.sc; S.node=d.n;
  S.su=d.su|0; S.tr=d.tr|0; S.it=d.it|0;
  S.flags=d.f||{}; S.obj=d.o||null; S.hints=d.h|0;
  S.choices=d.c||[]; S.reports=d.r||[]; S.map=d.m||S.map; S.m1done=d.d1|0;
  updateChrome(); updateHUD();
  routeScene();
  return true;
}
function routeScene(){
  switch(S.scene){
    case "pro":
      show("s-map"); $("s-map").hidden=true; $("hud").hidden=false;
      go(S.node||"p1"); break;
    case "map":
      enterMap(); if(S.obj) renderObj(); break;
    case "report": enterMapBackdrop(); startReport(); break;
    case "done": showDone(); break;
    default: show("s-title");
  }
}
function autoSave(){
  LS.set(AUTO_KEY, makeCode());
}

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(()=>{}); }
  else{
    const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy");}catch(e){} ta.remove();
  }
}

/* ---------- decode puzzle (prologue) ---------- */
const DECODE1={
  en:[{n:721}," met ",{n:722}," at ",{n:729},"."],
  es:[{n:721}," se reunió con ",{n:722}," en ",{n:729},"."],
  inst:{en:"Read the note. Tap each number, then pick the right word. Open the 📖 code book if you need it.",
        es:"Lee la nota. Toca cada número y elige la palabra correcta. Abre el libro 📖 si lo necesitas."},
  done:{en:"You can read the ring's secret language.", es:"Ya puedes leer el idioma secreto de la red."},
};
function puzDecode(cb){
  const solved={};
  let active=null;
  function render(){
    const toks=DECODE1[L()];
    const line=toks.map((t,idx)=>{
      if(typeof t==="string") return esc(t);
      if(solved[t.n]) return `<button class="chip done" disabled>${esc(TT(CODEMAP[t.n]))}</button>`;
      return `<button class="chip" data-n="${t.n}" data-i="${idx}">${t.n}</button>`;
    }).join("");
    let opts="";
    if(active!==null){
      const right=CODEMAP[active];
      const wrongs=CODES.filter(c=>c[0]!==active && !solved[c[0]]).slice(0,8);
      const pick=[right, wrongs[3][1], wrongs[5][1]].map(w=>({w,ok:w===right}));
      pick.sort(()=>((active*7)%3)-1);
      opts=`<div class="chip-opts">`+pick.map((p,i)=>
        `<button data-ok="${p.ok?1:0}">${esc(TT(p.w))}</button>`).join("")+`</div>`;
    }
    const all=DECODE1.en.filter(t=>typeof t!=="string").every(t=>solved[t.n]);
    $("puzbox").innerHTML=`<h3 class="serif">📜 ${L()==="en"?"A coded note":"Una nota en clave"}</h3>
      <p class="puz-inst">${esc(TT(DECODE1.inst))}</p>
      <div class="decode-line">${line}</div>${opts}
      <div class="puz-foot">
        <span class="puz-msg" id="dc-msg">${all?esc(TT(DECODE1.done)):""}</span>
        <span style="flex:1"></span>
        <button id="dc-book">📖 ${esc(TT(UI.book))}</button>
        ${all?`<button class="primary" id="dc-go">${esc(TT(UI.cont))}</button>`:""}
      </div>`;
    $("puzbox").querySelectorAll(".chip[data-n]").forEach(b=>{
      b.addEventListener("click",()=>{ active=+b.dataset.n; render(); });
    });
    $("puzbox").querySelectorAll(".chip-opts button").forEach(b=>{
      b.addEventListener("click",()=>{
        if(b.dataset.ok==="1"){ solved[active]=1; active=null; render(); }
        else{ b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"),350); }
      });
    });
    $("dc-book").addEventListener("click",()=>{ renderBook(); openModal("m-book"); });
    const goB=$("dc-go");
    if(goB) goB.addEventListener("click",()=>{ $("m-puz").hidden=true; PUZ=null; cb(); });
  }
  PUZ={rerender:render};
  render();
  openModal("m-puz");
}

const LAUNDRY={

  shirt:{qty:2, name:{en:"work shirt",es:"camisa de trabajo"},

  socks:{qty:2, name:{en:"wool socks",es:"calcetas de lana"},
    svg:'<svg viewBox="0 0 40 48"><path d="M12 5h7v22c0 6-9 8-9 2zM23 5h7v22c0 6-9 8-9 2z" fill="#9aa8bb" stroke="#6c7a8d"/></svg>'},
};
const CL_TEXT={
  h:{en:"Hang the signal",es:"Cuelga la señal"},
  inst:{en:"Make the line speak. Hang the black petticoat. Then hang one white handkerchief for each number of the meeting cove. Which cove? Remember Abraham's words.",
        es:"Haz hablar a la cuerda. Cuelga la enagua negra. Luego cuelga un pañuelo blanco por cada número de la caleta de encuentro. ¿Qué caleta? Recuerda las palabras de Abraham."},
  wrong1:{en:"Look again. Caleb reads this line from the water. Count the handkerchiefs.",
          es:"Mira otra vez. Caleb lee esta cuerda desde el agua. Cuenta los pañuelos."},
  wrong2:{en:"The petticoat must be there too — one, and only one.",
          es:"La enagua también debe estar, una y solo una."},
  hint1:{en:"Hint: the tall rocks mark the cove.", es:"Pista: las rocas altas marcan la caleta."},
  hint2:{en:"Hint: it is cove 4. Hang the black petticoat and 4 handkerchiefs.",
         es:"Pista: es la caleta 4. Cuelga la enagua negra y 4 pañuelos."},
};
function puzClothesline(cb){
  const slots=new Array(7).fill(null);
  let sel=null, placedCount=0, interrupted=false, attempts=0, hintN=0, msg="";
  function counts(){ const c={}; slots.forEach(s=>{ if(s) c[s]=(c[s]||0)+1; }); return c; }
  function remaining(k){ return LAUNDRY[k].qty-(counts()[k]||0); }
  function render(){
    const c=counts();
    $("puzbox").innerHTML=`<h3 class="serif">🧺 ${esc(TT(CL_TEXT.h))}</h3>
      <p class="puz-inst">${esc(TT(CL_TEXT.inst))}</p>
      <div id="linewrap"><div id="lineslots">${slots.map((s,i)=>
        `<button class="slot ${s?"filled":""}" data-i="${i}" aria-label="slot ${i+1}">${s?LAUNDRY[s].svg:""}</button>`).join("")}
      </div></div>
      <div class="tray">${Object.keys(LAUNDRY).map(k=>
        `<button data-k="${k}" class="${sel===k?"sel":""}" ${remaining(k)<=0?"disabled":""}>
          ${LAUNDRY[k].svg}<span>${esc(TT(LAUNDRY[k].name))} ×${remaining(k)}</span></button>`).join("")}
      </div>
      <div class="puz-foot">
        <span class="puz-msg">${esc(msg)}</span><span style="flex:1"></span>
        <button id="cl-hint">💡 ${esc(TT(UI.hint))}</button>
        <button class="primary" id="cl-check">${esc(TT(UI.check))}</button>
      </div>`;
    $("puzbox").querySelectorAll(".tray button").forEach(b=>{
      b.addEventListener("click",()=>{ sel=(sel===b.dataset.k)?null:b.dataset.k; msg=""; render(); });
    });
    $("puzbox").querySelectorAll(".slot").forEach(b=>{
      b.addEventListener("click",()=>{
        const i=+b.dataset.i;
        if(slots[i]){ slots[i]=null; msg=""; render(); return; }
        if(sel && remaining(sel)>0){
          slots[i]=sel; if(remaining(sel)<=0) sel=null;
          placedCount++; msg=""; render();
          if(placedCount===2 && !interrupted){
            interrupted=true;
            $("m-puz").hidden=true;
            PUZ.resume=()=>{ openModal("m-puz"); render(); };
            go("gi1");
          }
        }
      });
    });
    $("cl-hint").addEventListener("click",()=>{
      hintN++; S.hints++;
      msg=plain(TT(hintN<2?CL_TEXT.hint1:CL_TEXT.hint2));
      render();
    });
    $("cl-check").addEventListener("click",()=>{
      const cc=counts();
      if((cc.pet||0)===1 && (cc.hank||0)===4){
        $("m-puz").hidden=true; PUZ=null; cb(); return;
      }
      attempts++;
      msg=plain(TT((cc.pet||0)!==1?CL_TEXT.wrong2:CL_TEXT.wrong1));
      if(attempts>=2 && hintN===0){ msg+=" "+plain(TT(CL_TEXT.hint1)); }
      render();
    });
  }
  PUZ={rerender:render, resume:null};
  render();
  openModal("m-puz");
}

      claim=b.dataset.c; render();
    }));
    $("puzbox").querySelectorAll("[data-e]").forEach(b=>b.addEventListener("click",()=>{
      const id=b.dataset.e;
      if(ev.includes(id)) ev=ev.filter(x=>x!==id);
      else{ ev.push(id); if(ev.length>2) ev.shift(); }
      render();
    }));
    $("rb-reason").addEventListener("input",e=>{ reason=e.target.value; });
    $("rb-send").addEventListener("click",()=>{
      if(!claim||ev.length!==2||reason.trim().length<3){
        $("rb-msg").textContent=TT(UI.rbNeed); return;
      }
      const cl=REPORT1.claims.find(c=>c.id===claim);
      const good = cl.ok && ev.every(id=>REPORT1.evidence.find(e=>e.id===id).ok);
      S.reports.push({m:1, claim, ev:ev.slice(), reason:reason.trim().slice(0,300), good});
      seal(good);
    });

  function seal(good){
    $("puzbox").innerHTML=`<div id="sealwrap">
      <svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="24" fill="#e8a33d"/><circle cx="30" cy="30" r="24" fill="none" stroke="#b97f22" stroke-width="3"/>

    </div>`;
    $("seal-go").addEventListener("click",()=>{
      $("m-puz").hidden=true; PUZ=null;
      go(good?"wash_good":"wash_weak");
    });
  }
  PUZ={rerender:render};
  render();
  openModal("m-puz");
}
