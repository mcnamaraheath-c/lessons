  gotPromised: '<path class="dash" d="M30 30 H70 L84 76 H16 Z"/><path class="dash" d="M38 50 l6 -8 l6 8 M62 50 l-6 -8 l-6 8 M28 66 l6 -8 l6 8 M50 66 l6 -8 l6 8 M72 66 l-6 -8 l-6 8"/>',
  gotNothing:  '',
  gotDash:     ''
};
function gotIcon(key) {
  const inner = GOT_ICONS[key];
  if (inner === undefined) return '';
  return `<span class="goticon" aria-hidden="true"><svg viewBox="0 0 100 100">${inner}</svg></span>`;
}
function ledgerRow(e) {
  return `<div class="lrow"><span class="gave">${T(C.ledger[e.gave])}</span>${arrowHtml(e)}` +
         `<span class="got${e.promised ? ' promised' : ''}">${gotIcon(e.got)}<span>${T(C.ledger[e.got])}</span></span></div>`;
}

/* ---------- Page renderers, one per page type ---------- */
const RENDER = {
  title(p, S) {
    const c = C.p00;
    return `<div class="page split titlepage">${frame(p, S)}<div class="text">
      <h1>${T(c.title)}</h1><div class="seal jp" aria-hidden="true">${OATH_MARK}</div>
      <p class="tag">${T(c.tagline)}</p>
      <button type="button" class="big" id="beginBtn">${T(C.ui.begin)}</button></div></div>`;
  },
  intro(p, S) {
    if (p.img) return `<div class="page split">${frame(p, S)}<div class="text"><div data-pg>${parasHtml(parasOf(p, S))}</div></div></div>`;
    return `<div class="page"><div class="text center" data-pg>${parasHtml(parasOf(p, S))}</div></div>`;
  },
  stats(p) {
    const c = C.p02;
    const cards = STAT_KEYS.map((k, i) =>
      `<div class="statcard${i > state.step ? ' off' : ''}"><h2><span class="jp">${STATS[k].mark}</span>${T(C.ui[k])}</h2>` +
      `<p>${T(c.cards[i])}</p></div>`).join('');
    return `<div class="page"><h1 style="text-align:center">${T(c.title)}</h1>
      <div class="statcards">${cards}</div>
      <p class="closing${state.step < 2 ? ' off' : ''}">${T(c.closing)}</p></div>`;
  },
  story(p, S) {
    const c = C[p.id];
    const lead = c.lead ? `<p class="lead">${T(c.lead)}</p>` : '';
    return `<div class="page split">${frame(p, S)}<div class="text">
      <h1>${T(c.title)}</h1>${c.when ? `<div class="when">${T(c.when)}</div>` : ''}
      <div data-pg>${lead}${parasHtml(parasOf(p, S))}${chipsHtml(V.deltas, c.note ? L(c.note) : '')}</div></div></div>`;
  },
  petition(p, S) { return RENDER.story(p, S); },
  inherit(p, S) { return RENDER.story(p, S); },
  decision(p, S) {
    const c = p.content ? p.content(S) : C[p.id];
    const chosen = state.choices['s' + p.scene];
    const locked = chosen && !TEACHER;
    const card = k => `<button type="button" class="card${chosen === k ? ' chosen' : ''}" data-choice="${k}"${locked ? ' disabled' : ''}>
      <span class="chead"><span class="badge">${k}</span><span class="ct">${T(c[k].title)}</span></span>
      <span class="cx">${T(c[k].text)}</span>${chosen === k ? `<span class="yours">${T(C.ui.yourChoice)}</span>` : ''}</button>`;
    return `<div class="page decision"><p class="situation" id="situation" tabindex="-1">${T(c.situation)}</p>
      <div class="cards">${card('A')}${card('B')}</div></div>`;
  },
  consequence(p, S) {
    const tail = p.plain ? '' :
      (V.deltas.length ? chipsHtml(V.deltas) : `<ul class="deltas"><li class="chip none">${T(C.ui.noChange)}</li></ul>`) +
      (V.note ? `<p class="ricezero">${T(C.ui.riceZero)}</p>` : '');
    const body = `${parasHtml(parasOf(p, S))}${tail}`;
    if (p.img) return `<div class="page split">${frame(p, S)}<div class="text"><div data-pg>${body}</div></div></div>`;
    return `<div class="page"><div class="text center" data-pg>${body}</div></div>`;
  },
  ledger(p, S) {
    const c = C[p.id] || {};
    const entry = S.ledger[S.ledger.length - 1];
    const rows = S.ledger.filter(e => e.gen === entry.gen).map(ledgerRow).join('');
    let top = '';
    if (c.intro) top = `<p class="intro">${T(c.intro)}</p>`;
    if (p.id === 'act2close') top = `<p class="intro">${T(entry.moved ? c.granted : c.none)}</p>`;
    const lines = c.lines
      ? `<div class="lines">${c.lines.map((x, i) => `<p${i >= state.step ? ' class="off"' : ''}>${T(x)}</p>`).join('')}</div>` : '';
    return `<div class="page ledger"><div class="seal jp" aria-hidden="true">${OATH_MARK}</div>
      <h1>${T(C.ui.ledgerTitle)}</h1>${top}
      <div class="lgrid">${ledgerHead()}${rows}</div>${chipsHtml(V.deltas)}${lines}
      <p class="scrollhint">${T(C.ui.scrollHint)}</p></div>`;
  },
  code() {
    const c = C.code;
    const rows = c.rows.map(r => `<div class="coderow"><span class="k jp" aria-hidden="true">${r.kanji}</span>
      <span><strong>${T(r.name)}</strong> — ${T(r.text)} <span class="ref">${T(r.ref)}</span></span></div>`).join('');
    return `<div class="page"><div class="text center"><h1>${T(c.title)}</h1><p>${T(c.intro)}</p>
      <div class="codes">${rows}</div><p>${T(c.closing)}</p></div></div>`;
  },
  storm(p, S) {
    const c = C[p.id];
    return `<div class="page wide">${frame(p, S)}<div class="text">
      ${c.title ? `<h1>${T(c.title)}</h1>` : ''}<div data-pg>${parasHtml(c.paras)}</div></div></div>`;
  },
  evidence() {
    const c = C.evidence;
    return `<div class="page evidence"><h1>${T(c.title)}</h1>
      <table class="ev"><thead><tr>${c.heads.map(h => `<th scope="col">${T(h)}</th>`).join('')}</tr></thead>
      <tbody>${c.rows.map(r => `<tr>${r.map(x => `<td>${T(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>
      <div class="evfoot"><button type="button" id="copyBtn">${T(C.ui.copyAll)}</button><p>${T(c.foot)}</p></div></div>`;
  },
  epilogue(p, S) {
    const c = C.epilogue;
    return `<div class="page"><div class="text center"><h1>${T(c.title)}</h1><div data-pg>${parasHtml(c.paras)}</div></div></div>`;
  },
  end(p, S) {
    const c = C.end;
    const gen2 = S.ledger.find(e => e.gen === 2) || {};
    const got = [c.rows[0].got, gen2.moved ? c.rows[1].gotField : c.rows[1].gotNothing, c.rows[2].got];
    const moved = [true, !!gen2.moved, false];
    const keys = ['gotLand', gen2.moved ? 'gotField' : 'gotNothing', 'gotNothing'];
    const rows = c.rows.map((r, i) => `<div class="lgen">${T(C.ui['gen' + (i + 1)])}</div>
      <div class="lrow"><span class="gave">${T(r.gave)}</span>${arrowHtml({ moved: moved[i], small: i === 1 })}<span class="got">${gotIcon(keys[i])}<span>${T(got[i])}</span></span></div>`).join('');
    return `<div class="page end ledger">${frame(p, S)}
      <div class="lgrid">${ledgerHead()}${rows}</div>
      <p class="thanks">${T(c.thanks)}</p>
      <button type="button" class="big" id="taskBtn">${T(c.openTask)}</button>
      <p class="credits">${T(c.credits)}</p></div>`;
  }
};

/* ---------- Fitting long pages: split paragraphs across steps instead of scrolling ---------- */
const overflows = () => stage.scrollHeight > stage.clientHeight + 2;
function paginate() {
  chunks = null;
  const box = stage.querySelector('[data-pg]');
  if (!box) return 1;
  const items = Array.from(box.children);
  if (items.length < 2 || !overflows()) return 1;
  const out = [];
  let start = 0;
  while (start < items.length) {
    items.forEach(el => { el.hidden = true; });
    let end = start;
    while (end < items.length) {
      items[end].hidden = false;
      if (end > start && overflows()) { items[end].hidden = true; break; }
      end++;
    }
    out.push([start, end]);
    start = end;
  }
  /* keep the stat chips with the paragraph before them */
  chunks = out;
  return out.length;
}
function showChunk() {
  if (!chunks) return;
  const items = Array.from(stage.querySelector('[data-pg]').children);
  const [a, b] = chunks[state.step];
  items.forEach((el, i) => { el.hidden = i < a || i >= b; });
}

/* ---------- Top strip ---------- */
function buildStats() {
  $('stats').innerHTML = STAT_KEYS.map(k =>
    `<div class="stat" data-stat="${k}"><span class="mark jp" aria-hidden="true">${STATS[k].mark}</span>` +
    `<span class="lbl"></span><span class="bar"><i></i></span><span class="num"></span><span class="tag"></span></div>`).join('');
}
const statEl = k => document.querySelector(`.stat[data-stat="${k}"]`);
function setBars(vals) {
  STAT_KEYS.forEach(k => {
    const el = statEl(k);
    el.querySelector('.bar i').style.width = (100 * vals[k] / STATS[k].max) + '%';
    el.querySelector('.num').textContent = vals[k];
  });
}
function showTag(d) {
  const tag = statEl(d.stat).querySelector('.tag');
  tag.textContent = d.text;
  tag.className = 'tag show ' + (d.up ? 'up' : 'down');
}
function showStats(animate) {
  STAT_KEYS.forEach(k => { statEl(k).querySelector('.tag').className = 'tag'; });
  if (!V.deltas.length) { setBars(V.after); return; }
  if (!animate || REDUCED) { setBars(V.after); V.deltas.forEach(showTag); return; }
  /* one change at a time, 400ms apart: the tag appears, then the bar fills or empties */
  const cur = { ...V.before };
  setBars(cur);
  V.deltas.forEach((d, i) => later(350 + i * 400, () => {
    showTag(d);
    later(250, () => { cur[d.stat] = V.after[d.stat]; setBars(cur); });
  }));
}

function renderChrome(p, animate) {
  const idx = pageIndex();
  $('where').innerHTML = ACT_MARK[p.act] + (p.scene ? `<span class="sc">·${p.scene}</span>` : '');
  /* stat bars stay hidden until the "Three things to watch" page introduces them */
  const visible = idx < INDEX.p02 ? 0 : (p.id === 'p02' ? state.step + 1 : 3);
  STAT_KEYS.forEach((k, i) => {
    const el = statEl(k);
    el.classList.toggle('off', i >= visible);
    el.querySelector('.lbl').textContent = L(C.ui[k]);
    el.setAttribute('aria-label', L(C.ui[k]) + ' ' + V.after[k] + ' / ' + STATS[k].max);
  });
  showStats(animate);
  const oath = $('oathBtn');
  oath.textContent = OATH_MARK;
  oath.setAttribute('aria-label', L(C.ui.openLedger));
  oath.title = L(C.ui.openLedger);
  $('backBtn').textContent = L(C.ui.back);
  $('backBtn').disabled = idx === 0 && state.step === 0;
  $('nextBtn').textContent = L(C.ui.next);
  const undecided = p.type === 'decision' && !state.choices['s' + p.scene];
  $('nextBtn').disabled = undecided || (idx === PAGES.length - 1 && state.step >= totalSteps - 1);
  $('langBtn').innerHTML = state.lang === 'en'
    ? `<b>${T(C.ui.langEN)}</b> / ${T(C.ui.langES)}` : `${T(C.ui.langEN)} / <b>${T(C.ui.langES)}</b>`;
  $('langBtn').setAttribute('aria-label', L(C.ui.langLabel));
  updateTts();
  if (TEACHER) {
    $('jumpLbl').textContent = L(C.ui.jump);
    $('jumpSel').value = p.id;
  }
}

/* ---------- Render ---------- */
function render(animate) {
  clearTimers();
  stopSpeech();
  const idx = pageIndex();
  const p = PAGES[idx];
  V = replay(idx);
  state.stats = V.after;
  state.flags = V.S.flags;
  state.ledger = V.S.ledger;
  state.riceZeroNoted = V.noted;
  state.history = PAGES.slice(0, idx).map(x => x.id);

  document.documentElement.lang = state.lang;
  document.title = L(C.ui.docTitle);

  /* Act 3 look: the paper and frame shift on the second inheritance page */
  if (p.id === 'inherit2' && animate && !REDUCED) {
    document.body.dataset.act = '2';
    later(1200, () => { document.body.dataset.act = '3'; });
  } else {
    document.body.dataset.act = String(p.act);
  }

  if (p.type === 'stats') state.step = Math.min(state.step, 2);
  if (p.id === 'ledger4') state.step = Math.min(state.step, C.ledger4.lines.length);
  stage.innerHTML = RENDER[p.type](p, V.S);
  stage.scrollTop = 0;
  stage.querySelectorAll('.frame img').forEach(img => {
    img.addEventListener('error', () => (img.closest('.zoom') || img).remove());   // missing file: the placeholder behind it shows
  });

  chunks = null;
  if (p.type === 'stats') totalSteps = 3;
  else if (p.id === 'ledger4') totalSteps = C.ledger4.lines.length + 1;
  else totalSteps = paginate();
  state.step = Math.max(0, Math.min(state.step, totalSteps - 1));
  showChunk();

  renderChrome(p, animate);
  save();

  const begin = $('beginBtn'), sit = $('situation');
  if (sit) sit.focus({ preventScroll: true });
  else if (begin) begin.focus({ preventScroll: true });
  else if (!$('nextBtn').disabled) $('nextBtn').focus({ preventScroll: true });
}

/* ---------- Navigation ---------- */
function next() {
  if (!$('overlay').hidden) return;
  if (state.step < totalSteps - 1) { state.step++; render(false); return; }
  const idx = pageIndex(), p = PAGES[idx];
  if (p.type === 'decision' && !state.choices['s' + p.scene]) return;
  if (idx >= PAGES.length - 1) return;
  state.page = PAGES[idx + 1].id;
  state.step = 0;
  render(true);
}
function back() {
  if (!$('overlay').hidden) return;
  if (state.step > 0) { state.step--; render(false); return; }
  const idx = pageIndex();
  if (idx === 0) return;
  state.page = PAGES[idx - 1].id;
  state.step = 99;                // land on the last step of the page before
  render(false);
}
function choose(k) {
  const p = PAGES[pageIndex()];
  if (p.type !== 'decision' || !$('overlay').hidden) return;
  const key = 's' + p.scene;
  if (state.choices[key] && !TEACHER) return;      // a choice, once made, is made
  state.choices[key] = k;
  state.page = PAGES[pageIndex() + 1].id;
  state.step = 0;
  render(true);
}
function jump(id) {
  if (!(id in INDEX)) return;
  PAGES.slice(0, INDEX[id]).forEach(p => {
    if (p.type === 'decision' && !state.choices['s' + p.scene]) state.choices['s' + p.scene] = 'A';
  });
  state.page = id;
  state.step = 0;
  render(false);
}

/* ---------- Read aloud ---------- */
let speaking = false;
function stopSpeech() {
  speaking = false;
  try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
}
function updateTts() {
  $('ttsBtn').textContent = L(speaking ? C.ui.stop : C.ui.readAloud);
  $('ttsBtn').disabled = !('speechSynthesis' in window);
}
function readAloud() {
  if (!('speechSynthesis' in window)) return;
  if (speaking) { stopSpeech(); updateTts(); return; }
  const text = (stage.innerText || stage.textContent || '').replace(/\s+/g, ' ').trim();
  if (!text) return;
  const u = new SpeechSynthesisUtterance(text);
  const want = state.lang === 'es' ? 'es-MX' : 'en-US';
  const short = want.slice(0, 2);
  const voices = window.speechSynthesis.getVoices() || [];
  const voice = voices.find(v => v.lang.replace('_', '-') === want) || voices.find(v => v.lang.slice(0, 2) === short);
  if (voice) u.voice = voice;
  u.lang = voice ? voice.lang : want;
  u.rate = 0.95;
  u.onend = u.onerror = () => { speaking = false; updateTts(); };
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
  speaking = true;
  updateTts();
}

/* ---------- Ledger overlay (誓 button) ---------- */
function openLedger() {
  const groups = [1, 2, 3].map(g => {
    const rows = state.ledger.filter(e => e.gen === g);
    return rows.length ? `<div class="lgen">${T(C.ui['gen' + g])}</div>${rows.map(ledgerRow).join('')}` : '';
  }).join('');
  $('overlay').innerHTML = `<div class="sheet ledger"><div class="seal jp" aria-hidden="true">${OATH_MARK}</div>
    <h1>${T(C.ui.ledgerTitle)}</h1>
    ${groups ? `<div class="lgrid">${ledgerHead()}${groups}</div>` : `<p class="intro">${T(C.ui.ledgerEmpty)}</p>`}
    <div class="closeRow"><button type="button" id="closeBtn">${T(C.ui.close)}</button></div></div>`;
  $('overlay').hidden = false;
  overlayReturn = $('oathBtn');
  $('closeBtn').focus();
}
/* Enlarged picture: any picture in a frame opens big in the same overlay */
let overlayReturn = null;
function openImage(btn) {
  const img = btn.querySelector('img');
  if (!img) return;
  $('overlay').innerHTML = `<div class="lightbox"><img src="${img.getAttribute('src')}" alt="${esc(img.alt)}">` +
    `<button type="button" id="closeBtn">${T(C.ui.close)}</button></div>`;
  $('overlay').hidden = false;
  overlayReturn = btn;
  $('closeBtn').focus();
}
function closeLedger() {
  if ($('overlay').hidden) return;
  $('overlay').hidden = true;
  $('overlay').innerHTML = '';
  const back = overlayReturn && document.contains(overlayReturn) ? overlayReturn : $('oathBtn');
  overlayReturn = null;
  back.focus();
}

/* ---------- Evidence: copy the three rows as plain text ---------- */
function copyEvidence(btn) {
  const c = C.evidence;
  const text = [c.heads.map(L).join('\t')].concat(c.rows.map(r => r.map(L).join('\t'))).join('\n');
  const done = () => { btn.textContent = L(C.ui.copied); later(1800, () => { btn.textContent = L(C.ui.copyAll); }); };
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

/* ---------- Events ---------- */
$('nextBtn').addEventListener('click', next);
$('backBtn').addEventListener('click', back);
$('ttsBtn').addEventListener('click', readAloud);
$('oathBtn').addEventListener('click', openLedger);
$('langBtn').addEventListener('click', () => { state.lang = state.lang === 'en' ? 'es' : 'en'; render(false); });
$('jumpSel').addEventListener('change', e => jump(e.target.value));
$('overlay').addEventListener('click', e => {
  if (e.target.id === 'overlay' || e.target.id === 'closeBtn' || e.target.closest('.lightbox img')) closeLedger();
});
stage.addEventListener('click', e => {
  const zoom = e.target.closest('.zoom');
  if (zoom) { openImage(zoom); return; }
  const card = e.target.closest('.card');
  if (card && !card.disabled) { choose(card.dataset.choice); return; }
  if (e.target.id === 'beginBtn') next();
  if (e.target.id === 'copyBtn') copyEvidence(e.target);
  if (e.target.id === 'taskBtn') window.open('writing-task.html', '_blank');
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') { closeLedger(); return; }
  if (e.target && /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); back(); return; }
  const k = e.key.toUpperCase();
  if (k === 'A' || k === 'B') choose(k);
});
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => render(false), 150);
});

/* ---------- Start ---------- */
(function init() {
  if (PARAMS.get('reset') === '1') {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    PARAMS.delete('reset');
    const q = PARAMS.toString();
    try { history.replaceState(null, '', location.pathname + (q ? '?' + q : '')); } catch (e) {}
  } else {
    load();
  }
  buildStats();
  if (TEACHER) {
    $('jumpSel').innerHTML = PAGES.map(p => `<option value="${p.id}">${p.id}</option>`).join('');
    $('jumpWrap').hidden = false;
  }
  render(false);
  /* web fonts change line lengths: fit the page again once they arrive */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(false));
})();

/* for the QA scripts */
window.OATH = { CONTENT, PAGES, replay, START, STATS, getState: () => state, next, back, choose, jump };
</script>
