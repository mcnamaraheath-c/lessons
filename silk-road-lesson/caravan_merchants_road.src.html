<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caravan: The Merchant's Road — The Silk Road, c. 800</title>
<style>
  :root{
    --dusk:#2b2633;          /* page background: desert dusk */
    --paper:#f4e9d3;         /* card parchment */
    --paper-edge:#e2d3b4;
    --paper-dark:#ece0c4;
    --ink:#2b2520;
    --ink-soft:#6f6353;
    --line:#cfc0a0;
    --terra:#b0512b;         /* terracotta accent (buttons, labels) */
    --gold:#c69b41;          /* gold accent */
    --jade:#2f6b57;          /* success green */
    --indigo:#39496b;        /* secondary accent */
    --coin:#a97e1f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:var(--dusk);
    color:var(--ink);line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  .mono{font-family:ui-monospace,'Courier New',monospace;}
  button{font-family:inherit;}
  button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:8px 16px;background:#221e29;color:#f0e5cd;border-bottom:2px solid var(--gold);
  }
  header .brand{font-family:ui-monospace,monospace;font-weight:700;letter-spacing:2px;font-size:.92rem;text-transform:uppercase;}
  header .brand small{display:block;letter-spacing:1px;font-size:.62rem;color:#b3a17c;font-weight:400;margin-top:1px;}
  .hdr-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .hbtn{background:transparent;color:#f0e5cd;border:1.5px solid #f0e5cd;border-radius:5px;padding:6px 12px;cursor:pointer;font-family:ui-monospace,monospace;font-weight:700;font-size:.78rem;white-space:nowrap;min-height:34px;}
  .hbtn.speaking{background:#f0e5cd;color:#221e29;}
  .hbtn[hidden]{display:none;}
  .lang-toggle{display:flex;border:1.5px solid #f0e5cd;border-radius:5px;overflow:hidden;font-weight:700;font-size:.8rem;}
  .lang-toggle button{background:transparent;color:#f0e5cd;border:none;padding:6px 11px;cursor:pointer;font-family:ui-monospace,monospace;font-weight:700;min-height:34px;}
  .lang-toggle button.active{background:#f0e5cd;color:#221e29;}

  /* ---------- meters ---------- */
  .meters{
    position:sticky;top:0;z-index:29; /* header pushes it down visually; fine on scroll */
    display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;
    padding:8px 10px;background:#2e2937;border-bottom:1px solid #453d52;
  }
  .meters[hidden]{display:none;}
  .meter{
    display:flex;align-items:center;gap:7px;background:#3a3346;border:1px solid #56497a00;
    border-radius:999px;padding:5px 14px;color:#f0e5cd;font-family:ui-monospace,monospace;font-size:.85rem;font-weight:700;
  }
  .meter .ico{font-size:1.05rem;}
  .meter small{font-weight:400;color:#b3a17c;letter-spacing:.5px;}
  .meter.flash{animation:meterflash .6s ease;}
  @keyframes meterflash{0%{background:#c69b41;color:#221e29;}100%{background:#3a3346;}}

  /* ---------- progress dots ---------- */
  .progress{display:flex;gap:6px;align-items:center;justify-content:center;padding:8px;background:#282331;flex-wrap:wrap;}
  .pdot{display:flex;align-items:center;gap:5px;font-family:ui-monospace,monospace;font-size:.7rem;color:#8a7d63;}
  .pdot .b{width:11px;height:11px;border-radius:50%;background:#463e52;border:1px solid #5a5065;}
  .pdot.done .b{background:var(--gold);border-color:var(--gold);}
  .pdot.current .b{background:var(--terra);border-color:var(--terra);box-shadow:0 0 0 3px rgba(176,81,43,.35);}
  .pdot.current{color:#f0e5cd;}
  .pdot .sep{color:#5a5065;}

  /* ---------- stage & cards ---------- */
  .stage{max-width:840px;margin:0 auto;padding:22px 14px 60px;}
  .card{
    background:var(--paper);
    border-radius:10px;
    box-shadow:0 14px 40px rgba(0,0,0,.5);
    border:1px solid var(--paper-edge);
    padding:0 0 24px;position:relative;overflow:hidden;
  }
  .card::before{content:"";display:block;height:10px;background:linear-gradient(90deg,var(--terra),var(--gold));}
  .card-head{padding:22px 28px 10px;border-bottom:2px solid var(--line);}
  .card-body{padding:16px 28px 0;}
  .kicker{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--ink-soft);letter-spacing:2px;text-transform:uppercase;}
  .card-head h1{font-size:1.85rem;margin:.15rem 0 .1rem;line-height:1.15;}
  .tagline{color:var(--ink-soft);font-size:1.02rem;font-style:italic;}
  .section-label{
    font-family:ui-monospace,monospace;font-size:.74rem;letter-spacing:2px;text-transform:uppercase;
    color:var(--terra);font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:10px;
  }
  .section-label::after{content:"";flex:1;height:1px;background:var(--line);}
  .scene{margin:0;position:relative;}
  .scene img,.scene svg{display:block;width:100%;height:auto;border-radius:0;}
  .scene figcaption{font-size:.8rem;color:var(--ink-soft);font-style:italic;padding:6px 28px 0;text-align:center;line-height:1.4;}

  figure.exhibit{margin:16px 0;text-align:center;}
  figure.exhibit img{max-width:100%;border:1px solid #b7a681;background:#fff;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:zoom-in;}
  figure.exhibit img.half{max-width:min(100%,460px);}
  figure.exhibit figcaption{font-size:.82rem;color:var(--ink-soft);margin-top:7px;font-style:italic;line-height:1.4;}

  .prose p{font-size:1.05rem;margin:.7rem 0;}
  .notebox{background:var(--paper-dark);border-left:5px solid var(--gold);padding:13px 17px;border-radius:0 8px 8px 0;margin:14px 0;font-size:1.02rem;}
  .notebox.terra{border-left-color:var(--terra);}

  /* ---------- NPC dialogue ---------- */
  .npc{display:flex;gap:14px;align-items:flex-start;margin:14px 0;}
  .npc .face{flex:0 0 150px;width:150px;height:150px;border-radius:10px;overflow:hidden;border:2px solid var(--gold);background:#ddd0b2;}
  .npc .bubble p{margin:.45rem 0;}
  .npc .bubble p:first-of-type{margin-top:0;}
  .npc .bubble p:last-of-type{margin-bottom:0;}
  .npc.big .face{flex-basis:220px;width:220px;height:220px;border-radius:14px;}
  .npc.big .bubble::before{top:40px;}
  .npc .face img,.npc .face svg{width:100%;height:100%;object-fit:cover;display:block;}
  .npc .bubble{
    background:#fbf4e4;border:1px solid var(--line);border-radius:10px;padding:12px 16px;flex:1;position:relative;font-size:1.04rem;
  }
  .npc .bubble::before{content:"";position:absolute;left:-9px;top:26px;border:9px solid transparent;border-right-color:var(--line);border-left:0;}
  .npc .who{font-family:ui-monospace,monospace;font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--terra);font-weight:700;margin-bottom:4px;}
  .talk-next{margin:10px 0 4px;text-align:center;}

  /* ---------- market ---------- */
  .goodrow{
    display:grid;grid-template-columns:40px minmax(0,1fr) 90px 120px 164px;align-items:center;gap:10px;
    background:#fbf4e4;border:1px solid var(--line);border-radius:9px;padding:10px 14px;margin:9px 0;
  }
  .goodrow .gico{font-size:1.5rem;text-align:center;}
  .goodrow .gname{font-weight:700;min-width:0;}
  .goodrow .gname small{display:block;font-weight:400;color:var(--ink-soft);font-size:.78rem;font-style:italic;}
  .goodrow .gprice{font-family:ui-monospace,monospace;font-weight:700;color:var(--coin);white-space:nowrap;}
  .goodrow .ghave{font-family:ui-monospace,monospace;font-size:.8rem;color:var(--ink-soft);white-space:nowrap;}
  .goodrow .gbtns{justify-self:end;display:flex;gap:8px;}
  .tbtn{
    border:2px solid var(--indigo);background:#fff;color:var(--indigo);border-radius:7px;
    padding:8px 14px;font-weight:700;cursor:pointer;font-size:.92rem;min-height:44px;min-width:74px;
  }
  .tbtn.buy{border-color:var(--jade);color:var(--jade);}
  .tbtn.sell{border-color:var(--terra);color:var(--terra);}
  .tbtn:disabled{opacity:.35;cursor:default;}
  .tbtn:not(:disabled):active{transform:scale(.97);}
  .market-log{
    min-height:44px;background:var(--paper-dark);border:1px dashed var(--gold);border-radius:8px;
    padding:10px 14px;margin:12px 0;font-size:1rem;
  }
  .market-log b{color:var(--terra);}
  .pricenote{font-size:.85rem;color:var(--ink-soft);font-style:italic;margin:6px 0 0;}

  /* ---------- decisions ---------- */
  .decide-box{margin:20px 0 8px;background:#efe3c8;border:2px dashed var(--terra);border-radius:10px;padding:18px;}
  .decide-box h3{margin:0 0 6px;font-family:ui-monospace,monospace;text-transform:uppercase;letter-spacing:1px;font-size:1rem;}
  .decide-box .q{margin:.2rem 0 14px;color:var(--ink-soft);}
  .choice{
    display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--indigo);border-radius:9px;
    padding:13px 16px;margin:9px 0;cursor:pointer;font-size:1rem;min-height:44px;
  }
  .choice b{display:block;margin-bottom:3px;color:var(--indigo);}
  .choice small{color:var(--ink-soft);font-size:.9rem;}
  .choice.chosen{border-color:var(--jade);background:#eef5ef;}
  .choice:disabled{opacity:.55;cursor:default;}
  .outcome{display:none;margin-top:14px;}
  .outcome.show{display:block;animation:fadein .5s ease;}
  .outcome .stamp2{
    display:inline-block;font-family:ui-monospace,monospace;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    border:3px solid var(--indigo);color:var(--indigo);border-radius:7px;padding:4px 12px;font-size:.75rem;transform:rotate(-2deg);margin-bottom:8px;
  }
  @keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* ---------- quick check ---------- */
  .qc{background:#fbf4e4;border:1px solid var(--line);border-left:5px solid var(--indigo);border-radius:0 8px 8px 0;padding:14px 17px;margin:13px 0;}
  .qc .qq{font-weight:700;margin-bottom:9px;}
  .qc .ans{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:8px;padding:11px 14px;margin:7px 0;cursor:pointer;font-size:.98rem;min-height:44px;}
  .qc .ans.right{border-color:var(--jade);background:#eaf3ec;}
  .qc .ans.wrong{border-color:#b06a2b;background:#f7ecdd;}
  .qc .fb{display:none;margin-top:8px;font-size:.95rem;padding:9px 12px;border-radius:7px;}
  .qc .fb.show{display:block;}
  .qc .fb.good{background:#e3efe6;border:1px solid var(--jade);}
  .qc .fb.try{background:#f6ead8;border:1px solid #b06a2b;}

  /* ---------- price strip / ledger ---------- */
  table.ledger{width:100%;border-collapse:collapse;margin:14px 0;font-size:.98rem;}
  table.ledger th{font-family:ui-monospace,monospace;font-size:.7rem;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);border-bottom:2px solid var(--line);padding:7px 8px;text-align:left;}
  table.ledger td{border-bottom:1px solid var(--line);padding:9px 8px;}
  table.ledger td.n{font-family:ui-monospace,monospace;font-weight:700;}
  table.ledger tr.total td{border-top:3px double var(--ink);font-weight:700;background:var(--paper-dark);}
  .bigcoins{font-family:ui-monospace,monospace;font-size:1.5rem;font-weight:700;color:var(--coin);}
  .pricestrip{display:flex;align-items:flex-end;gap:6px;margin:16px 0 4px;padding:0 4px;height:130px;}
  .pricestrip .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%;}
  .pricestrip .bar .col{width:100%;max-width:64px;background:linear-gradient(180deg,var(--gold),var(--terra));border-radius:4px 4px 0 0;}
  .pricestrip .bar .v{font-family:ui-monospace,monospace;font-weight:700;font-size:.85rem;}
  .pricestrip .bar .c{font-size:.66rem;color:var(--ink-soft);text-align:center;line-height:1.2;font-family:ui-monospace,monospace;}

  /* ---------- reflection ---------- */
  .reflect-q{margin:14px 0;}
  .reflect-q .qtext{font-weight:700;margin-bottom:6px;}
  .reflect-q textarea{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:8px;padding:10px;font-family:Georgia,serif;font-size:1rem;background:#fffdf6;}
  .disclaimer{font-size:.85rem;color:var(--ink-soft);font-style:italic;margin-top:14px;}

  /* ---------- nav ---------- */
  .nav{display:flex;justify-content:space-between;gap:10px;padding:20px 28px 0;}
  .navbtn{
    background:var(--terra);color:#fff;border:none;border-radius:8px;padding:13px 22px;
    font-size:1.02rem;font-weight:700;cursor:pointer;min-height:48px;
  }
  .navbtn.ghost{background:transparent;color:var(--terra);border:2px solid var(--terra);}
  .navbtn.locked{opacity:.45;cursor:not-allowed;}
  .navbtn.big{font-size:1.15rem;padding:15px 30px;display:block;margin:18px auto 0;}

  /* ---------- vocab tooltips ---------- */
  .vocab{border-bottom:1.5px dotted var(--terra);cursor:help;position:relative;}
  .vocab:hover,.vocab:focus{background:rgba(176,81,43,.10);outline:none;}
  .vocab .tooltip{
    visibility:hidden;opacity:0;position:absolute;bottom:135%;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:10px 13px;width:230px;font-family:Georgia,serif;font-size:.85rem;
    line-height:1.45;z-index:60;border-radius:6px;transition:opacity .2s;text-align:left;font-weight:400;font-style:normal;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
  }
  .vocab:hover .tooltip,.vocab:focus .tooltip{visibility:visible;opacity:1;}
  .vocab .tooltip .es{display:block;margin-top:7px;padding-top:7px;border-top:1px dashed rgba(198,155,65,.5);color:#eecd8c;font-style:italic;font-size:.82rem;}
  .vocab .tooltip .es::before{content:"🌐 ";font-style:normal;}

  /* ---------- caravan code modal ---------- */
  #codebox{position:fixed;inset:0;z-index:90;background:rgba(23,19,28,.9);display:flex;align-items:center;justify-content:center;padding:20px;}
  #codebox[hidden]{display:none;}
  .codecard{background:var(--paper);border-radius:12px;max-width:520px;width:100%;padding:24px 26px;position:relative;box-shadow:0 16px 50px rgba(0,0,0,.6);}
  .codecard h3{margin:0 0 8px;}
  .codeval{font-family:ui-monospace,monospace;font-weight:700;font-size:1.15rem;background:#fff;border:2px dashed var(--gold);border-radius:8px;padding:12px;word-break:break-all;text-align:center;margin:10px 0;user-select:all;}
  .codecard input{width:100%;font-family:ui-monospace,monospace;font-size:1rem;padding:11px;border:2px solid var(--line);border-radius:8px;margin:8px 0;}
  .codecard .err{color:var(--terra);font-weight:700;font-size:.9rem;min-height:1.2em;margin:2px 0;}
  .codecard .x{position:absolute;top:10px;right:12px;background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:var(--ink-soft);padding:6px;}

  /* ---------- lightbox ---------- */
  #lightbox{position:fixed;inset:0;z-index:100;background:rgba(20,17,12,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;}
  #lightbox[hidden]{display:none;}
  #lightbox img{max-width:94vw;max-height:82vh;object-fit:contain;background:#fff;padding:6px;box-shadow:0 10px 40px rgba(0,0,0,.6);}
  #lightbox-cap{max-width:70ch;margin-top:12px;color:#f0e5cd;font-size:.95rem;font-style:italic;text-align:center;line-height:1.45;}
  .lightbox-x{position:absolute;top:14px;right:18px;background:transparent;border:1.5px solid #f0e5cd;color:#f0e5cd;border-radius:6px;font-size:1.3rem;line-height:1;padding:6px 12px;cursor:pointer;font-family:ui-monospace,monospace;}

  /* ---------- title screen ---------- */
  .title-card{text-align:center;padding-bottom:30px;}
  .title-card h1{font-size:clamp(1.9rem,6vw,3rem);margin:.4rem 0 .2rem;}
  .title-card .sub{font-style:italic;color:var(--ink-soft);font-size:1.1rem;}

  @media (max-width:640px){
    .card-head,.card-body,.nav{padding-left:16px;padding-right:16px;}
    .npc .face{flex-basis:96px;width:96px;height:96px;}
    .npc.big{flex-direction:column;align-items:center;}
    .npc.big .face{flex-basis:auto;width:200px;height:200px;}
    .npc.big .bubble::before{display:none;}
    .goodrow{grid-template-columns:40px minmax(0,1fr) 80px 110px;}
    .goodrow .gbtns{grid-column:1 / -1;justify-self:end;}
  }
  /* ---------- dice ---------- */
  .dice-wrap{display:flex;align-items:center;gap:18px;margin:14px 0 6px;flex-wrap:wrap;}
  .die{width:76px;height:76px;background:#fff;border:3px solid var(--ink);border-radius:14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;box-shadow:0 5px 14px rgba(0,0,0,.28);flex:0 0 auto;}
  .die span{width:13px;height:13px;border-radius:50%;background:var(--ink);align-self:center;justify-self:center;visibility:hidden;}
  .die[data-v="1"] .p5,.die[data-v="2"] .p3,.die[data-v="2"] .p7,.die[data-v="3"] .p3,.die[data-v="3"] .p5,.die[data-v="3"] .p7,
  .die[data-v="4"] .p1,.die[data-v="4"] .p3,.die[data-v="4"] .p7,.die[data-v="4"] .p9,
  .die[data-v="5"] .p1,.die[data-v="5"] .p3,.die[data-v="5"] .p5,.die[data-v="5"] .p7,.die[data-v="5"] .p9,
  .die[data-v="6"] .p1,.die[data-v="6"] .p3,.die[data-v="6"] .p4,.die[data-v="6"] .p6,.die[data-v="6"] .p7,.die[data-v="6"] .p9{visibility:visible;}
  .die.rolling{animation:diceshake .14s infinite;}
  @keyframes diceshake{0%{transform:rotate(-10deg) translate(-2px,-2px);}50%{transform:rotate(10deg) translate(2px,2px);}100%{transform:rotate(-10deg) translate(-2px,-2px);}}
  .dice-text{font-size:1.05rem;}
  .dice-text b{color:var(--terra);}
  .dice-text .win{color:var(--jade);font-weight:700;}
  .dice-text .lose{color:var(--terra);font-weight:700;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<header>
  <div class="brand">CARAVAN<small id="brand-sub">The Merchant's Road — c. 800</small></div>
  <div class="hdr-tools">
    <button id="listen-btn" class="hbtn" hidden onclick="toggleSpeech()" aria-pressed="false">🔊 <span id="listen-label">Read aloud</span></button>
    <button id="home-btn" class="hbtn" onclick="goHome()">🏠 <span id="home-label">Home</span></button>
    <button id="code-btn" class="hbtn" onclick="openCodeBox(false)">🐫 <span id="code-label">Caravan Code</span></button>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button id="lang-en" onclick="setLang('en')">EN</button>
      <button id="lang-es" onclick="setLang('es')">ES</button>
    </div>
  </div>
</header>

<div class="meters" id="meters" hidden>
  <span class="meter" id="m-coins"><span class="ico">🪙</span><span id="m-coins-v">0</span>&nbsp;<small id="m-coins-l">coins</small></span>
  <span class="meter" id="m-cargo"><span class="ico">📦</span><span id="m-cargo-v">0/6</span>&nbsp;<small id="m-cargo-l">cargo</small></span>
  <span class="meter" id="m-supplies"><span class="ico">🫓</span><span id="m-supplies-v">0</span>&nbsp;<small id="m-supplies-l">supplies</small></span>
</div>
<div class="progress" id="progress" role="list" aria-label="Journey progress"></div>

<main class="stage" id="stage"></main>

<div id="codebox" hidden>
  <div class="codecard" role="dialog" aria-modal="true" aria-labelledby="codebox-title">
    <button class="x" onclick="closeCodeBox()" aria-label="Close">✕</button>
    <h3 id="codebox-title"></h3>
    <div id="codebox-body"></div>
  </div>
</div>

<div id="lightbox" hidden>
  <button class="lightbox-x" onclick="closeLightbox()" aria-label="Close">✕</button>
  <img id="lightbox-img" src="" alt="">
  <div id="lightbox-cap"></div>
</div>

<script>
"use strict";
/* Images are injected at build time (node build_embed.js). Missing keys fall back to drawn placeholder scenes. */
var IMG = "__IMG_JSON__";
if (typeof IMG === 'string') { IMG = {}; }

/* ---------- PLACEHOLDER SCENE ART (used until the teacher's generated images land in img/generated/) ---------- */
function camelPath(x,y,s){
  return "<g transform='translate("+x+","+y+") scale("+s+")'><path d='M0,18 l3,-10 l2,-8 l3,8 h4 l2,-6 l3,6 h6 l2,-14 l3,-2 l2,3 l-1,13 h2 l-1,18 h-3 l-1,-8 h-2 l-1,8 h-3 l-1,-8 h-8 l-1,8 h-3 l-1,-8 h-2 l-1,8 h-3 z' fill='#241d17' opacity='0.85'/></g>";

function sceneHTML(key){
  if (IMG[key]) return "<img src='"+IMG[key]+"' alt=''>";
  var fallback = {cover:'cover', bg_changan:'changan', bg_jadegate:'jadegate', bg_kashgar:'kashgar', bg_samarkand:'samarkand', bg_baghdad:'baghdad', bg_constantinople:'constantinople'};
  var fn = SCENES[fallback[key] || key];
  return fn ? fn() : "";
}
function faceHTML(npc){
  if (IMG[npc.img]) return "<img src='"+IMG[npc.img]+"' alt=''>";
  return faceSVG(npc.initials, npc.hue);
}

function wrap(text){
  var vocab = state.language==='es' ? VOCAB_ES : VOCAB;
  var keys = Object.keys(vocab).sort(function(a,b){return b.length-a.length;});
  var result=text, ph=[];
  keys.forEach(function(key,idx){
    var flags = state.language==='es' ? '' : 'i';
    var re = new RegExp('\\b('+key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b',flags);
    result = result.replace(re,function(m){ ph.push({idx:idx,match:m,key:key}); return '__V'+idx+'__'; });
  });
  ph.forEach(function(p){
    var d=vocab[p.key];
    var primary = state.language==='es'?d.es:d.en, secondary = state.language==='es'?d.en:d.es;
    result = result.replace('__V'+p.idx+'__','<span class="vocab" tabindex="0">'+p.match+'<span class="tooltip">'+primary+'<span class="es">'+secondary+'</span></span></span>');
  });
  return result;
}
function fmt(tpl, map){
  var out = tpl;
  Object.keys(map).forEach(function(k){ out = out.split('{'+k+'}').join(map[k]); });
  return out;
}

       risk:{need:5, win:{stamp:{en:"Clear skies", es:"Cielo despejado"}, fx:{}, out:{en:"The sky stays blue for six straight days. The shortcut works: you reach Kashgar sooner and burn no extra supplies. The old camel men shake their heads — they have watched that same sky turn black in an hour.", es:"El cielo se queda azul seis días seguidos. El atajo funciona: llegas antes a Kashgar y no gastas provisiones extra. Los viejos camelleros mueven la cabeza — han visto ese mismo cielo volverse negro en una hora."}}},
       fx:{supplies:-4},
       out:{en:"On the third day the sky turns yellow, then black. A sandstorm buries the trail. Your caravan huddles for two days, eating through 4 extra supplies, and wanders another day to find the road. Merchants told stories that the desert's name meant “you go in and you don't come out.” Now you understand the stories.", es:"Al tercer día el cielo se vuelve amarillo, luego negro. Una tormenta de arena entierra el sendero. Tu caravana se refugia dos días, gastando 4 provisiones extra, y vaga un día más para hallar el camino. Los mercaderes contaban que el nombre del desierto significaba «entras y no sales.» Ahora entiendes esas historias."}}
    ]
  }
},
/* ============ 2. KASHGAR ============ */
{
  id:"kashgar",
  name:{en:"Kashgar", es:"Kashgar"},
  where:{en:"Oasis crossroads at the foot of the Pamir mountains", es:"Cruce de caminos al pie de las montañas del Pamir"},
  scene:"bg_kashgar",
  sceneCap:{en:"Kashgar's bazaar under the mountains — as our artist imagines it.", es:"El bazar de Kashgar bajo las montañas — como lo imagina nuestro artista."},
  arrive:[
    {en:"Every road around the great desert meets again at Kashgar. In its bazaar you see faces from China, India, Persia, and the steppes — all at the same melon stall.", es:"Todos los caminos que rodean el gran desierto se juntan otra vez en Kashgar. En su bazar ves rostros de China, India, Persia y las estepas — todos en el mismo puesto de melones."},
    {en:"To the west, a wall of snow mountains blocks the sky: the Pamirs. Travelers call them the Roof of the World. Your camels will hate them.", es:"Al oeste, una muralla de montañas nevadas tapa el cielo: los Pamir. Los viajeros las llaman el Techo del Mundo. Tus camellos las van a odiar."}
  ],
  exhibits:[],
  npcs:[{
    name:{en:"Old Yusuf", es:"Viejo Yusuf"}, img:"npc_old_yusuf", initials:"YSF", hue:"#3d5a45",
    lines:[
      {en:"Forty years I have led camels over those mountains. Rule one: what is heavy and breakable stays here. Rule two: hire help, or pay in broken pots.", es:"Cuarenta años llevando camellos por esas montañas. Regla uno: lo pesado y frágil se queda aquí. Regla dos: contrata ayuda, o paga en ollas rotas."},
      {en:"You are looking at that jade? Ha! Jade is dug up near here. Carry it EAST to Chang'an and emperors pay fortunes. Carry it west and every city pays you less. Wrong direction, friend.", es:"¿Miras ese jade? ¡Ja! El jade se saca cerca de aquí. Llévalo al ESTE, a Chang'an, y los emperadores pagan fortunas. Llévalo al oeste y cada ciudad te paga menos. Dirección equivocada, amigo."},
      {en:"Tea, though — the horse lords of the steppe drink rivers of it. Tea sells for a high price here and in the lands nearby. Farther west? They shrug at it.", es:"El té, en cambio — los señores de los caballos de la estepa beben ríos de té. El té se vende caro aquí y en las tierras cercanas. ¿Más al oeste? Se encogen de hombros."}
    ]
  }],
  check:[{
    q:{en:"Yusuf says jade sells best far to the EAST, in Chang'an. Why?", es:"Yusuf dice que el jade se vende mejor lejos, al ESTE, en Chang'an. ¿Por qué?"},
    answers:[
      {t:{en:"Jade is found near Kashgar, and the people who prize it most live in China", es:"El jade se encuentra cerca de Kashgar, y quienes más lo valoran viven en China"}, ok:true},
      {t:{en:"Jade gets heavier when you carry it west", es:"El jade se vuelve más pesado si lo llevas al oeste"}, ok:false},
      {t:{en:"It is against the law to sell jade in the west", es:"Es ilegal vender jade en el oeste"}, ok:false}
    ],
    good:{en:"Right. Goods flow toward the people who want them and cannot get them nearby. Silk flows west. Jade flows east. A smart merchant learns which way each good 'wants' to travel.", es:"Correcto. Las mercancías fluyen hacia la gente que las desea y no las tiene cerca. La seda fluye al oeste. El jade fluye al este. Un buen mercader aprende hacia dónde 'quiere' viajar cada mercancía."},
    trymsg:{en:"Where is jade dug up? Where do the people who love it most live?", es:"¿Dónde se saca el jade? ¿Dónde vive la gente que más lo ama?"}
  }],
  road:{
    needs:4,
    intro:{en:"The trail west climbs into thin, freezing air. The passes are higher than the clouds. There is ice on the stones. This is the hardest part of the whole road.", es:"El sendero al oeste sube a un aire helado y delgado. Los pasos están más altos que las nubes. Hay hielo en las piedras. Este es el tramo más duro de todo el camino."},
    q:{en:"How will you take your caravan over the Roof of the World?", es:"¿Cómo llevarás tu caravana por el Techo del Mundo?"},
    options:[
      {title:{en:"Hire Yusuf's yak porters — 6 coins", es:"Contrata a los porteadores con yaks de Yusuf — 6 monedas"},
       detail:{en:"Yaks are sure-footed on ice. Your cargo rides safe.", es:"Los yaks pisan firme en el hielo. Tu carga viaja segura."},
       stamp:{en:"Cargo safe", es:"Carga a salvo"},
       fx:{coins:-6},
       out:{en:"The yaks plod up the ice like it is a garden path. Yusuf's porters know every stone. Six coins felt expensive in Kashgar — on the highest pass, watching a yak carry your porcelain over a frozen ledge, it feels cheap. Local experts were worth their price on every leg of the Silk Road.", es:"Los yaks suben por el hielo como si fuera un jardín. Los porteadores de Yusuf conocen cada piedra. Seis monedas parecían caras en Kashgar — en el paso más alto, viendo a un yak llevar tu porcelana sobre una cornisa helada, parecen baratas. Los expertos locales valían su precio en cada tramo de la Ruta de la Seda."}},
      {title:{en:"Push your own camels over the passes", es:"Sube con tus propios camellos"},
       detail:{en:"Free — but camels slip on ice, and cargo falls.", es:"Gratis — pero los camellos resbalan en el hielo, y la carga cae."},
       stamp:{en:"A load is lost", es:"Se pierde una carga"},
       risk:{need:4, win:{stamp:{en:"Sure-footed", es:"Pie firme"}, fx:{}, out:{en:"Your camels pick their way over the ice as if they were born on it. Every load arrives whole, and you saved 6 coins. Merchants who crossed these passes many times knew this kind of luck does not last.", es:"Tus camellos cruzan el hielo como si hubieran nacido en él. Cada carga llega entera, y ahorraste 6 monedas. Los mercaderes que cruzaron estos pasos muchas veces sabían que esa suerte no dura."}}},
       fx:{loseLoad:"porcelain", elseCoins:-4},
       out:{en:"On the second pass, a camel slips on black ice. If you carried porcelain, you hear it — a crunch inside the pack, a full load in pieces. If not, the camel goes lame and mountain herders charge 4 coins to treat and re-shoe your animals. The Pamirs always take their toll, and merchants planned for it.", es:"En el segundo paso, un camello resbala en el hielo. Si llevabas porcelana, lo oyes — un crujido dentro del fardo, una carga entera en pedazos. Si no, el camello queda cojo y los pastores de la montaña cobran 4 monedas por curar y herrar a tus animales. Los Pamir siempre cobran su parte, y los mercaderes contaban con ello."}}
    ]
  }
},
/* ============ 3. SAMARKAND ============ */
{
  id:"samarkand",
  name:{en:"Samarkand", es:"Samarcanda"},
  where:{en:"City of the Sogdians — the master traders of the road", es:"Ciudad de los sogdianos — los maestros del comercio del camino"},
  scene:"bg_samarkand",
  sceneCap:{en:"Evening in a Samarkand caravanserai — as our artist imagines it.", es:"Atardecer en un caravasar de Samarcanda — como lo imagina nuestro artista."},
  arrive:[
    {en:"Down from the mountains, into gardens and canals: Samarkand. This is the home city of the Sogdians, a people famous from China to Persia for one skill — trade.", es:"Bajas de las montañas a jardines y canales: Samarcanda. Es la ciudad de los sogdianos, un pueblo famoso de China a Persia por una sola habilidad — el comercio."},
    {en:"Sogdian merchants run caravanserais and trading posts along the whole road. Their letters travel thousands of miles between family shops. Even market children in Chang'an pick up Sogdian words for buying and selling.", es:"Los mercaderes sogdianos manejan caravasares y puestos de comercio por todo el camino. Sus cartas viajan miles de kilómetros entre tiendas familiares. Hasta los niños del mercado en Chang'an aprenden palabras sogdianas para comprar y vender."}
  ],
  exhibits:[{key:"afrasiab", cap:{en:"A Sogdian wall painting made in Samarkand in the 600s: ambassadors from many lands, in patterned silk robes, arrive in procession. It was found in the old city, Afrasiab, and can be seen in Samarkand today. Tap to enlarge — look for the silk patterns.", es:"Una pintura mural sogdiana hecha en Samarcanda en el siglo VII: embajadores de muchas tierras, con túnicas de seda estampada, llegan en procesión. Se encontró en la ciudad vieja, Afrasiab, y hoy puede verse en Samarcanda. Tócala para ampliarla — busca los estampados de seda."}}],
  npcs:[
    {name:{en:"Vandak the Sogdian", es:"Vandak el sogdiano"}, img:"npc_vandak", initials:"VDK", hue:"#5a3a6b",
     lines:[
      {en:"Chinese silk! Straight from Chang'an? Merchant, you amaze me. I have sold Chinese silk for twenty years — and I have never seen China. My silk has. I have not.", es:"¡Seda china! ¿Directa de Chang'an? Mercader, me asombras. Llevo veinte años vendiendo seda china — y nunca he visto China. Mi seda sí. Yo no."},
      {en:"My grandfather bought from a man in Kashgar, who bought from a man in Dunhuang, who bought in Chang'an. Each of us runs one piece of the road. The goods run all of it.", es:"Mi abuelo compraba a un hombre en Kashgar, que compraba a un hombre en Dunhuang, que compraba en Chang'an. Cada uno de nosotros recorre un tramo del camino. Las mercancías lo recorren todo."},
      {en:"You carry it yourself the whole way? Brave. Expensive, too — you will see. Every toll and every mountain comes out of YOUR purse alone.", es:"¿Tú lo llevas todo el camino? Valiente. Y caro — ya verás. Cada peaje y cada montaña sale solo de TU bolsa."}
     ]},
    {name:{en:"Roshan the paper-maker", es:"Roshan la papelera"}, img:"npc_roshan", initials:"RSH", hue:"#2f6b57",
     lines:[
      {en:"You brought paper to sell? Oh, merchant. Fifty years ago, after a great battle at Talas, Chinese papermakers settled here and taught us the craft. Samarkand makes its own paper now — good paper, cheap paper.", es:"¿Trajiste papel para vender? Ay, mercader. Hace cincuenta años, tras una gran batalla en Talas, papeleros chinos se establecieron aquí y nos enseñaron el oficio. Samarcanda ya hace su propio papel — bueno y barato."},
      {en:"That is the road for you: goods travel, but so do the SKILLS to make them. Then the price falls. Sell your paper farther west — or better, in lands the paper mills have not reached.", es:"Así es el camino: viajan las mercancías, pero también las TÉCNICAS para hacerlas. Y entonces el precio baja. Vende tu papel más al oeste — o mejor, donde los molinos aún no llegan."}
     ]}
  ],
  check:[
    {q:{en:"Vandak sells Chinese silk, but he has never been to China. How is that possible?", es:"Vandak vende seda china, pero nunca ha estado en China. ¿Cómo es posible?"},
     answers:[
      {t:{en:"Goods passed from merchant to merchant, each carrying them one stretch — like a relay race", es:"Las mercancías pasaban de mercader en mercader, cada uno un tramo — como una carrera de relevos"}, ok:true},
      {t:{en:"He is lying — all silk merchants had to visit China", es:"Miente — todos los vendedores de seda tenían que visitar China"}, ok:false},
      {t:{en:"Silk walked by itself along the road", es:"La seda caminaba sola por el camino"}, ok:false}
     ],
     good:{en:"That is relay trade — the great secret of the Silk Road. Almost nobody traveled the whole road. The goods did, passing through many hands, each hand adding to the price.", es:"Eso es el comercio de relevos — el gran secreto de la Ruta de la Seda. Casi nadie recorría todo el camino. Las mercancías sí, pasando por muchas manos, y cada mano subía el precio."},
     trymsg:{en:"Think of a relay race: does one runner run the whole race?", es:"Piensa en una carrera de relevos: ¿un solo corredor corre toda la carrera?"}},
    {q:{en:"Paper sells for LESS here than in Kashgar. Why?", es:"El papel se vende por MENOS aquí que en Kashgar. ¿Por qué?"},
     answers:[
      {t:{en:"Samarkand learned to make its own paper, so it is no longer rare here", es:"Samarcanda aprendió a hacer su propio papel, así que ya no es raro aquí"}, ok:true},
      {t:{en:"People in Samarkand cannot read or write", es:"La gente de Samarcanda no sabe leer ni escribir"}, ok:false},
      {t:{en:"Paper spoils in the mountain air", es:"El papel se echa a perder en el aire de montaña"}, ok:false}
     ],
     good:{en:"Yes. When the skill to make something travels, the thing stops being rare — and its price drops. Technology traveled the road just like cargo.", es:"Sí. Cuando viaja la técnica para hacer algo, ese algo deja de ser raro — y su precio baja. La tecnología viajaba por el camino igual que la carga."},
     trymsg:{en:"Remember what Roshan told you about the battle of Talas.", es:"Recuerda lo que Roshan te contó sobre la batalla de Talas."}}
  ],
  road:{
    needs:4,
    intro:{en:"West of Samarkand the road runs through dry hills and long empty stretches — perfect country for bandits who watch the passes for small, rich caravans.", es:"Al oeste de Samarcanda el camino cruza colinas secas y largos tramos vacíos — tierra perfecta para bandidos que vigilan los pasos buscando caravanas pequeñas y ricas."},
    q:{en:"A great caravan of eighty camels leaves for Baghdad tonight. Its master will guard your goods — for a fee of 5 coins.", es:"Una gran caravana de ochenta camellos sale hacia Bagdad esta noche. Su jefe protegerá tus mercancías — por una cuota de 5 monedas."},
    options:[
      {title:{en:"Pay 5 coins and join the great caravan", es:"Paga 5 monedas y únete a la gran caravana"},
       detail:{en:"Eighty camels, armed guards, safety in numbers.", es:"Ochenta camellos, guardias armados, seguridad en grupo."},
       stamp:{en:"Safe passage", es:"Paso seguro"},
       fx:{coins:-5},
       out:{en:"Bandits watch your caravan from the hills — and stay in the hills. Nobody attacks eighty camels and their guards. At night you sleep in caravanserais, one day's walk apart, built so that traders always have walls around them. Safety was something merchants bought, and it was the best bargain on the road.", es:"Los bandidos miran tu caravana desde las colinas — y se quedan en las colinas. Nadie ataca a ochenta camellos y sus guardias. De noche duermes en caravasares, a un día de camino uno de otro, construidos para que los mercaderes siempre tuvieran murallas alrededor. La seguridad se compraba, y era la mejor ganga del camino."}},
      {title:{en:"Travel alone and move fast", es:"Viaja solo y muévete rápido"},
       detail:{en:"Keep your coins. Small caravans are quick — and tempting.", es:"Guarda tus monedas. Las caravanas pequeñas son rápidas — y tentadoras."},
       stamp:{en:"Bandits!", es:"¡Bandidos!"},
       risk:{need:4, win:{stamp:{en:"Fast and lucky", es:"Rápido y con suerte"}, fx:{}, out:{en:"You travel by night and rest by day. The riders in the hills never spot your small caravan. Fast, free — and lucky. Many lone caravans on this road were not.", es:"Viajas de noche y descansas de día. Los jinetes de las colinas nunca ven tu pequeña caravana. Rápido, gratis — y con suerte. Muchas caravanas solitarias en este camino no la tuvieron."}}},
       fx:{coins:-12, orLoad:true},
       out:{en:"On the fourth night, riders come out of the dark. They are quick, quiet, and very practiced: they demand 12 coins, take what they can, and ride off. It could have been far worse — lone caravans sometimes lost everything. This is exactly why the caravanserai system existed, and why merchants paid to travel together.", es:"La cuarta noche, jinetes salen de la oscuridad. Son rápidos, silenciosos y con mucha práctica: exigen 12 monedas, toman lo que pueden y se van. Pudo ser mucho peor — las caravanas solitarias a veces lo perdían todo. Justo para esto existía el sistema de caravasares, y por eso los mercaderes pagaban por viajar juntos."}}
    ]
  }
},
/* ============ 4. BAGHDAD ============ */
{

  arrive:[
    {en:"Baghdad is not even fifty years old, and it may already be the richest city west of China. The caliph built it as a perfect circle where the land roads meet the river roads to the sea.", es:"Bagdad no tiene ni cincuenta años, y quizá ya es la ciudad más rica al oeste de China. El califa la construyó como un círculo perfecto donde los caminos de tierra se cruzan con los caminos del río hacia el mar."},
    {en:"Ships from India unload at the docks. Caravans from Samarkand unload at the gates. Everything meets here — goods, and something else: books, scholars, and ideas from every land.", es:"Barcos de la India descargan en los muelles. Caravanas de Samarcanda descargan en las puertas. Todo se encuentra aquí — mercancías, y algo más: libros, sabios e ideas de todas las tierras."}
  ],
  exhibits:[{key:"baghdad_caravan", half:true, cap:{en:"A caravan on the road, painted in Baghdad by the artist al-Wasiti in 1237 — four centuries after your journey, but the camels, banners, and trumpets looked much the same in your day. Kept today at the National Library of France.", es:"Una caravana en el camino, pintada en Bagdad por el artista al-Wasiti en 1237 — cuatro siglos después de tu viaje, pero los camellos, estandartes y trompetas se veían muy parecidos en tu época. Hoy se guarda en la Biblioteca Nacional de Francia."}}],
  npcs:[{
    name:{en:"Scholar Salim", es:"El sabio Salim"}, img:"npc_scholar_salim", initials:"SLM", hue:"#39496b",
    lines:[
      {en:"You come from Chang'an? Then you come from the land where paper was born! Our House of Wisdom is filling with books because paper is cheap now. We translate the Greeks, the Persians, the Indians — everything.", es:"¿Vienes de Chang'an? ¡Entonces vienes de la tierra donde nació el papel! Nuestra Casa de la Sabiduría se está llenando de libros porque el papel ya es barato. Traducimos a los griegos, los persas, los indios — todo."},
      {en:"Merchants think they carry cloth and spice. They also carry numbers, star charts, and medicine. A caravan is a school that walks.", es:"Los mercaderes creen que llevan tela y especias. También llevan números, mapas de estrellas y medicina. Una caravana es una escuela que camina."},
      {en:"One warning for the road west: the Byzantines tax every load at their border. Every merchant grumbles. Every merchant pays. Almost every merchant, anyway…", es:"Un aviso para el camino al oeste: los bizantinos cobran impuesto por cada carga en su frontera. Todo mercader se queja. Todo mercader paga. Bueno, casi todos…"}
    ]
  }],
  check:[{
    q:{en:"Why did Baghdad grow so rich, so fast?", es:"¿Por qué Bagdad se hizo tan rica, tan rápido?"},
    answers:[
      {t:{en:"It sits where the great land routes and river-to-sea routes meet", es:"Está donde se cruzan las grandes rutas de tierra y las rutas del río al mar"}, ok:true},
      {t:{en:"Gold was discovered under the city", es:"Se descubrió oro debajo de la ciudad"}, ok:false},
      {t:{en:"It never had to pay for anything", es:"Nunca tuvo que pagar por nada"}, ok:false}
    ],
    good:{en:"Location, location, location. Cities grow rich where trade routes cross — every caravan and every ship pays, buys, sells, and rests there. Chang'an, Samarkand, Baghdad, Constantinople: all crossroads cities.", es:"Ubicación, ubicación, ubicación. Las ciudades se enriquecen donde se cruzan las rutas — cada caravana y cada barco paga, compra, vende y descansa allí. Chang'an, Samarcanda, Bagdad, Constantinopla: todas ciudades de cruce."},
    trymsg:{en:"Look at where the caliph chose to build it. What meets there?", es:"Mira dónde decidió construirla el califa. ¿Qué se cruza allí?"}
  }],
  road:{
    needs:3,
    intro:{en:"The last leg. The road climbs northwest toward the border of the Byzantine empire. At the frontier post, imperial officials weigh and record every single load.", es:"El último tramo. El camino sube al noroeste hacia la frontera del imperio bizantino. En el puesto fronterizo, los oficiales imperiales pesan y anotan cada carga."},
    q:{en:"The customs officers demand the emperor's tax: 6 coins on your cargo.", es:"Los oficiales de aduana exigen el impuesto del emperador: 6 monedas por tu carga."},
    options:[
      {title:{en:"Declare everything and pay the 6 coins", es:"Declara todo y paga las 6 monedas"},
       detail:{en:"Legal entry, sealed papers, no fear at the checkpoints.", es:"Entrada legal, papeles sellados, sin miedo en los controles."},
       stamp:{en:"Sealed and legal", es:"Sellado y legal"},
       fx:{coins:-6},
       out:{en:"The officials list your goods, take 6 coins, and give you a sealed permit. The Byzantines taxed everything that crossed their border — it paid for their armies and roads. From here to the capital, no guard can touch you: your papers are in order.", es:"Los oficiales anotan tus mercancías, toman 6 monedas y te dan un permiso sellado. Los bizantinos cobraban impuestos por todo lo que cruzaba su frontera — pagaba sus ejércitos y caminos. De aquí a la capital, ningún guardia puede tocarte: tus papeles están en orden."}},
      {title:{en:"Hide a silk load inside the tea bales", es:"Esconde una carga de seda entre los fardos de té"},
       detail:{en:"Pay tax on less. Risky — Byzantine inspectors are famous for finding things.", es:"Paga impuesto por menos. Arriesgado — los inspectores bizantinos son famosos por encontrar cosas."},
       stamp:{en:"Found it", es:"La encontraron"},
       risk:{need:5, win:{stamp:{en:"Not found", es:"No la encontraron"}, fx:{coins:-4}, out:{en:"The inspector's rod slides right past your hidden silk. He stamps your papers and waves you through. You paid tax on less — 4 coins instead of 6. If he had found it, the fine would have been more than double.", es:"La vara del inspector pasa justo al lado de tu seda escondida. Sella tus papeles y te deja pasar. Pagaste impuesto por menos — 4 monedas en vez de 6. Si la hubiera encontrado, la multa habría sido más del doble."}}},
       fx:{coins:-14, orLoad:true},

/* ============ 5. CONSTANTINOPLE ============ */
{
  id:"constantinople",
  name:{en:"Constantinople", es:"Constantinopla"},
  where:{en:"Capital of the Byzantine empire — the end of the road", es:"Capital del imperio bizantino — el fin del camino"},
  scene:"bg_constantinople",
  sceneCap:{en:"The harbor of Constantinople — as our artist imagines it.", es:"El puerto de Constantinopla — como lo imagina nuestro artista."},
  arrive:[
    {en:"Golden domes. Sea walls. Ships from every port of the Mediterranean. You walk your tired camels through the gates of Constantinople — the city your uncle only heard about in stories.", es:"Cúpulas doradas. Murallas junto al mar. Barcos de todos los puertos del Mediterráneo. Cruzas con tus camellos cansados las puertas de Constantinopla — la ciudad que tu tío solo conocía por historias."},
    {en:"Here, Chinese silk is treasure. Nobles pay fortunes for it. Your last job is simple: sell everything, count your coins, and learn what this road really taught you.", es:"Aquí, la seda china es un tesoro. Los nobles pagan fortunas por ella. Tu último trabajo es simple: véndelo todo, cuenta tus monedas y descubre qué te enseñó de verdad este camino."}
  ],
  exhibits:[{key:"quadriga_silk", half:true, cap:{en:"A piece of Byzantine silk woven in Constantinople around the year 800 — the very years of your journey. It shows a four-horse chariot from the city's races. Silk this fine wrapped kings; a piece of it later wrapped the emperor Charlemagne's bones. Kept today in Paris.", es:"Un trozo de seda bizantina tejida en Constantinopla hacia el año 800 — los mismos años de tu viaje. Muestra un carro de cuatro caballos de las carreras de la ciudad. Sedas así envolvían reyes; un trozo envolvió después los huesos del emperador Carlomagno. Hoy se guarda en París."}}],
  npcs:[{

function freshState(){

  GOOD_KEYS.forEach(function(g){ cargo[g]=0; buys[g]={q:0,c:0}; sells[g]={q:0,c:0}; });
  return {
    language: state && state.language ? state.language : 'en',
    pos: 0,
    coins: START_COINS, camels: START_CAMELS, supplies: START_SUPPLIES,
    cargo: cargo, buys: buys, sells: sells,
    decisions: {},           /* cityIdx -> option index chosen */
    rolls: {},               /* cityIdx -> {r, need, ok} for dice gambles */
    seed: Math.floor(Math.random()*1e9), /* shuffles quick-check answers per game */
    checks: {},              /* cityIdx -> {qIdx:true} once answered correctly */
    finalSold: false
  };
}
var state = { language:'en' };
state = freshState();

/* ---------- SCREEN SEQUENCE ---------- */
var SEQ = [{t:'title'},{t:'intro'}];
CITIES.forEach(function(city, i){
  SEQ.push({t:'city', c:i});
  SEQ.push({t:'market', c:i});

});

function cur(){ return SEQ[state.pos]; }
function cityOf(scr){ return (scr && typeof scr.c === 'number') ? CITIES[scr.c] : null; }
function cargoCount(){ var n=0; GOOD_KEYS.forEach(function(g){ n+=state.cargo[g]; }); return n; }

/* ---------- PERSISTENCE ---------- */
function saveLocal(){
  if(cur().t === 'title') return; /* the title screen is not a journey state — never overwrite a saved journey with it */
  try { localStorage.setItem('caravanState', JSON.stringify(state)); } catch(e){}
}
function loadLocal(){
  try {
    var raw = localStorage.getItem('caravanState');

    var s = JSON.parse(raw);
    if(s && typeof s.pos === 'number' && s.cargo) return s;
  } catch(e){}
  return null;
}

/* ---------- CARAVAN CODE ----------
   12 characters, Crockford base32 (no I, L, O, U — students' 1/l/0/O mix-ups are auto-corrected on entry).
   Carries the essentials to resume: position, coins, camels, supplies, cargo, and the current road
   decision, plus a 10-bit checksum. Trade history is NOT in the code (it lives in localStorage and on the
   paper ledger); see renderLedger for how a code-resumed journey is reported honestly. */
var B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function bitsOf(n, w){ n = Math.max(0, Math.min((1<<w)-1, n|0)); var s = n.toString(2); while(s.length < w) s = '0'+s; return s; }
function encodeCode(){
  var bits = '';
  bits += bitsOf(2, 2);                 /* version */
  bits += bitsOf(state.pos, 5);
  bits += bitsOf(state.coins, 9);       /* capped at 511 in the code */
  bits += bitsOf(state.camels, 3);
  bits += bitsOf(state.supplies, 5);    /* capped at 31 */
  GOOD_KEYS.forEach(function(g){ bits += bitsOf(state.cargo[g], 4); });
  var scr = cur(), dec = 0;
  if(scr.t === 'road' && state.decisions[scr.c] !== undefined) dec = state.decisions[scr.c] + 1;
  bits += bitsOf(dec, 2);
  /* checksum: fold the 50 payload bits into 10 */
  var sum = 0;
  for(var i=0;i<bits.length;i+=5){ sum = (sum * 31 + parseInt(bits.substr(i,5),2)) % 1021; }
  bits += bitsOf(sum, 10);
  var out = '';
  for(var j=0;j<bits.length;j+=5){ out += B32[parseInt(bits.substr(j,5),2)]; }
  return out.replace(/(.{4})(?=.)/g, '$1-');
}
function normalizeCode(code){
  return String(code || '').toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/I|L/g,'1').replace(/O/g,'0');
}
function decodeCode(code){
  try {
    var c = normalizeCode(code);
    if(c.length !== 12) return null;
    var bits = '';
    for(var i=0;i<c.length;i++){ var v = B32.indexOf(c[i]); if(v<0) return null; bits += bitsOf(v,5); }
    var payload = bits.substr(0,50), chk = parseInt(bits.substr(50,10),2);
    var sum = 0;
    for(var k=0;k<payload.length;k+=5){ sum = (sum * 31 + parseInt(payload.substr(k,5),2)) % 1021; }
    if(sum !== chk) return null;
    var at = 0; function take(w){ var v = parseInt(payload.substr(at,w),2); at += w; return v; }
    if(take(2) !== 2) return null;
    var s = freshState();
    s.pos = Math.max(2, Math.min(SEQ.length-1, take(5)));
    s.coins = take(9); s.camels = Math.max(1, Math.min(MAX_CAMELS, take(3))); s.supplies = take(5);
    GOOD_KEYS.forEach(function(g){ s.cargo[g] = take(4); });
    var dec = take(2);
    var scr = SEQ[s.pos], ci = (typeof scr.c === 'number') ? scr.c : CITIES.length;
    /* everything before the current city is done; the current city's check is done if we are past it */
    CITIES.forEach(function(city, i){
      var checkPos = SEQ.findIndex(function(x){ return x.t==='check' && x.c===i; });
      if(i < ci || (i === ci && s.pos > checkPos)){ s.checks[i] = {}; city.check.forEach(function(q,qi){ s.checks[i][qi]=true; }); }
      if(i < ci && city.road){ s.decisions[i] = 0; if(!s.traveled) s.traveled = {}; s.traveled[i] = true; }
    });
    s.maxCity = ci;
    if(scr.t === 'road' && dec > 0) s.decisions[ci] = dec - 1;
    s.finalSold = s.pos > SEQ.findIndex(function(x){ return x.t==='market' && x.c===5; });
    /* trade history is not in the code: remember what was carried in so the ledger can say so */
    s.carriedIn = {}; GOOD_KEYS.forEach(function(g){ s.carriedIn[g] = s.cargo[g]; });
    s.codeResumed = true;
    return s;
  } catch(e){ return null; }
}

function renderProgress(){

/* ---------- RENDER ---------- */
var stage = document.getElementById('stage');
function render(){
  if(typeof speech !== 'undefined' && speech.on) stopSpeech();
  if(typeof setListenState === 'function') setListenState();
  var lb = document.getElementById('lightbox');
  if(lb && !lb.hidden) closeLightbox();

  if(scr.t==='title') renderTitle();
  else if(scr.t==='intro') renderIntro();
  else if(scr.t==='city') renderCity(scr.c);
  else if(scr.t==='market') renderMarket(scr.c);
  else if(scr.t==='check') renderCheck(scr.c);
  else if(scr.t==='rest') renderRest();
  else if(scr.t==='road') renderRoad(scr.c);
  else if(scr.t==='ledger') renderLedger();
  else if(scr.t==='relay') renderRelay();
  else if(scr.t==='ideas') renderIdeas();
  else if(scr.t==='reflect') renderReflect();
  renderProgress();
  updateMeters();
  tagEnlargeableImages();
  saveLocal();
  window.scrollTo(0,0);
}
function go(n){ state.pos = Math.max(0, Math.min(SEQ.length-1, n)); render(); }

function backLimit(){ return 0; }
function navHTML(nextLocked, nextLabel, lockMsg){

function renderCity(ci){

function marketRow(g, ci){
  var L = state.language, good = GOODS[g], price = priceOf(g, ci);
  var have = state.cargo[g];
  var closed = ci < maxCity();
  var buyDis = closed || price===null || state.coins < price || cargoCount() >= cargoCap();
  var sellDis = closed || price===null || have <= 0;
  return '<div class="goodrow">'+
    '<span class="gico" aria-hidden="true">'+good.ico+'</span>'+
    '<span class="gname">'+good.name[L]+'<small>'+good.note[L]+'</small></span>'+
    '<span class="gprice">'+(price===null ? '<small>'+T('notSoldHere')+'</small>' : '🪙 '+price)+'</span>'+
    '<span class="ghave">'+T('youHave')+': '+have+'</span>'+
    '<span class="gbtns">'+
      '<button class="tbtn buy" '+(buyDis?'disabled':'')+' onclick="buyGood(\''+g+'\')">'+T('buy1')+'</button>'+
      '<button class="tbtn sell" '+(sellDis?'disabled':'')+' onclick="sellGood(\''+g+'\')">'+T('sell1')+'</button>'+
    '</span>'+
  '</div>';
}
function renderMarket(ci){
  var c = CITIES[ci], L = state.language;
  var isFinal = ci === 5;
  var closed = ci < maxCity();
  var rows = GOOD_KEYS.filter(function(g){ return priceOf(g, ci) !== null; }).map(function(g){ return marketRow(g, ci); }).join('');
  var supplyRow = '<div class="goodrow">'+
    '<span class="gico" aria-hidden="true">🫓</span>'+
    '<span class="gname">'+T('supplyName')+'<small>'+T('supplyNote')+'</small></span>'+

  '</div>';
  var camelRow = '';
  if((ci===1 || ci===2) && state.camels < MAX_CAMELS && !closed){
    camelRow = '<div class="goodrow">'+
      '<span class="gico" aria-hidden="true">🐫</span>'+
      '<span class="gname">'+T('camelName')+'<small>'+T('camelNote')+'</small></span>'+
      '<span class="gprice">🪙 '+CAMEL_PRICE+'</span>'+
      '<span class="ghave">'+T('youHave')+': '+state.camels+'</span>'+
      '<span class="gbtns"><button class="tbtn buy" '+(state.coins<CAMEL_PRICE?'disabled':'')+' onclick="buyCamel()">'+T('buy1')+'</button></span>'+

  }

  }
  stage.innerHTML =

    '<div class="card-head">'+
      '<div class="kicker">'+(isFinal ? T('finalSaleKicker') : c.name[L])+'</div>'+

    '</div>'+

}
function logMsg(html){ var el=document.getElementById('mlog'); if(el) el.innerHTML = html; }
function refreshMarket(){ var scr=cur(); if(scr.t==='market'){ var msg=document.getElementById('mlog')?document.getElementById('mlog').innerHTML:''; renderMarket(scr.c); logMsg(msg); updateMeters(); } }
function marketOpen(){ var s = cur(); return s.t === 'market' && s.c >= maxCity(); }
function buyGood(g){
  var ci = cur().c, price = priceOf(g, ci), L = state.language;
  if(price===null || !marketOpen()) return;
  if(state.coins < price){ logMsg('<b>'+T('noCoins')+'</b>'); return; }
  if(cargoCount() >= cargoCap()){ logMsg('<b>'+T('noRoom')+'</b>'); return; }
  state.coins -= price; state.cargo[g]++; state.buys[g].q++; state.buys[g].c += price;
  refreshMarket();
  logMsg(fmt(T('youBought'), {g:GOODS[g].name[L], p:price, c:state.coins}));
  updateMeters('m-coins'); saveLocal();
}
function sellGood(g){
  var ci = cur().c, price = priceOf(g, ci), L = state.language;
  if(price===null || !marketOpen()) return;
  if(state.cargo[g] <= 0){ logMsg('<b>'+T('noStock')+'</b>'); return; }
  state.coins += price; state.cargo[g]--; state.sells[g].q++; state.sells[g].c += price;
  refreshMarket();
  logMsg(fmt(T('youSold'), {g:GOODS[g].name[L], p:price, c:state.coins}));
  updateMeters('m-coins'); saveLocal();
}
function sellAll(){
  var ci = cur().c, L = state.language, lines = [];
  GOOD_KEYS.forEach(function(g){
    var price = priceOf(g, ci);
    while(state.cargo[g] > 0 && price !== null){
      state.coins += price; state.cargo[g]--; state.sells[g].q++; state.sells[g].c += price;
      lines.push(fmt(T('youSold'), {g:GOODS[g].name[L], p:price, c:state.coins}));
    }
    /* goods with no market here (none in Constantinople) would simply remain — all six trade there */
  });
  state.finalSold = true;
  refreshMarket();
  logMsg(lines.join('<br>') || T('logStart'));
  updateMeters('m-coins'); saveLocal();
}
function buySupply(){
  if(!marketOpen()) return;
  if(state.coins < 1){ logMsg('<b>'+T('noCoins')+'</b>'); return; }
  state.coins -= 1; state.supplies += 1;
  refreshMarket();
  logMsg(fmt(T('boughtSupply'), {c:state.coins}));
  updateMeters('m-supplies'); saveLocal();
}
function buyCamel(){
  if(!marketOpen()) return;
  if(state.camels >= MAX_CAMELS){ logMsg(T('maxCamels')); return; }
  if(state.coins < CAMEL_PRICE){ logMsg('<b>'+T('noCoins')+'</b>'); return; }
  state.coins -= CAMEL_PRICE; state.camels += 1;
  refreshMarket();
  logMsg(fmt(T('boughtCamel'), {p:CAMEL_PRICE, c:state.coins}));
  updateMeters('m-cargo'); saveLocal();
}

/* ---------- QUICK CHECK ---------- */
function seededOrder(n, seed){
  /* mulberry32 — same seed, same order, so a student's answers stay put while they play */
  var t = (seed >>> 0) || 1, idx = [];
  for(var i=0;i<n;i++) idx.push(i);
  function rnd(){ t += 0x6D2B79F5; var x = Math.imul(t ^ (t >>> 15), 1 | t); x ^= x + Math.imul(x ^ (x >>> 7), 61 | x); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }
  for(var k=n-1;k>0;k--){ var j = Math.floor(rnd()*(k+1)); var tmp = idx[k]; idx[k] = idx[j]; idx[j] = tmp; }
  return idx;
}
function renderCheck(ci){
  var c = CITIES[ci], L = state.language;
  var done = state.checks[ci] || {};
  var qs = c.check.map(function(q, qi){
    var answered = !!done[qi];
    var order = seededOrder(q.answers.length, (state.seed||0) + ci*101 + qi*7);
    var btns = order.map(function(ai){
      var a = q.answers[ai];
      var cls = 'ans';
      if(answered && a.ok) cls += ' right';
      return '<button class="'+cls+'" '+(answered?'disabled':'')+' onclick="answerCheck('+ci+','+qi+','+ai+', this)">'+a.t[L]+'</button>';
    }).join('');
    return '<div class="qc" id="qc'+qi+'"><div class="qq">'+wrap(q.q[L])+'</div>'+btns+
      '<div class="fb good'+(answered?' show':'')+'" id="fbg'+qi+'">'+T('qcRight')+' '+wrap(q.good[L])+'</div>'+
      '<div class="fb try" id="fbt'+qi+'"></div></div>';
  }).join('');
  var allDone = c.check.every(function(q, qi){ return !!done[qi]; });
  stage.innerHTML =
  '<div class="card">'+
    '<div class="card-head"><div class="kicker">'+c.name[L]+'</div><h1>'+T('qcLabel')+'</h1></div>'+
    '<div class="card-body">'+qs+'</div>'+
    navHTML(!allDone)+
  '</div>';
}
function answerCheck(ci, qi, ai, btn){
  var c = CITIES[ci], q = c.check[qi], L = state.language;
  if(q.answers[ai].ok){
    if(!state.checks[ci]) state.checks[ci] = {};
    state.checks[ci][qi] = true;
    var qc = document.getElementById('qc'+qi);
    qc.querySelectorAll('.ans').forEach(function(b){ b.disabled = true; });
    btn.classList.add('right');
    document.getElementById('fbt'+qi).classList.remove('show');
    document.getElementById('fbg'+qi).classList.add('show');
    var allDone = c.check.every(function(qq, k){ return state.checks[ci] && state.checks[ci][k]; });
    if(allDone) unlockNext();
    saveLocal();
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    var ft = document.getElementById('fbt'+qi);
    ft.innerHTML = T('qcTry')+' '+wrap(q.trymsg[L]);
    ft.classList.add('show');
  }
}

    return '<button class="'+cls+'" '+(decided?'disabled':'')+' onclick="chooseRoad('+ci+','+oi+')"><b>'+o.title[L]+'</b><small>'+o.detail[L]+roll+'</small></button>';
  }).join('');
  var o = decided ? r.options[chosen] : null;
  var animating = decided && pendingRoll === ci;
  stage.innerHTML =
  '<div class="card">'+
    '<div class="card-head"><div class="kicker">'+c.name[L]+' → '+CITIES[ci+1].name[L]+'</div><h1>'+T('roadLabel')+'</h1></div>'+
    '<div class="card-body prose">'+
      '<p>'+wrap(r.intro[L])+'</p>'+

      '<div class="decide-box"><h3>'+T('chooseLabel')+'</h3><p class="q">'+wrap(r.q[L])+'</p>'+opts+
      (animating ? diceHTML(ci, true) : '')+
      '<div class="outcome'+(decided && !animating ?' show':'')+'" id="outcome">'+(decided?outcomeHTML(o):'')+'</div></div>'+
    '</div>'+
    navHTML(!canSetOut(ci) || animating, T('setOut'), animating ? T('rolling') : (decided ? T('needMoreSupplies') : T('decideFirst')))+
  '</div>';
  if(animating){
    pendingRoll = null;
    var rollInfo = state.rolls[ci];
    animateDice(document.getElementById('die-'+ci), rollInfo.r, function(){
      var dt = document.getElementById('dice-text-'+ci);
      if(dt) dt.innerHTML = diceResultText(rollInfo);
      var oc = document.getElementById('outcome');
      if(oc){ oc.classList.add('show'); if(oc.scrollIntoView) oc.scrollIntoView({behavior:'smooth', block:'center'}); }
      if(canSetOut(ci)) prepSetOut(ci);
    });
  } else if(decided && canSetOut(ci)) prepSetOut(ci);
}
var pendingRoll = null;
var DICE_MS = 1400;
function dieFace(id, v){
  var pips = ''; for(var i=1;i<=9;i++) pips += '<span class="p'+i+'"></span>';
  return '<div class="die" id="'+id+'" data-v="'+v+'" aria-hidden="true">'+pips+'</div>';
}
function diceResultText(info){
  return fmt(T('rolled'), {r:info.r, n:info.need}) + ' <span class="'+(info.ok?'win':'lose')+'">'+(info.ok ? T('rollWin') : T('rollLose'))+'</span>';
}
function diceHTML(ci, animating){
  var info = state.rolls[ci];
  if(!info) return '';
  return '<div class="dice-wrap">'+dieFace('die-'+ci, animating ? 1 : info.r)+
    '<div class="dice-text" id="dice-text-'+ci+'">'+(animating ? T('rolling') : diceResultText(info))+'</div></div>';
}
function reducedMotion(){
  try { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; }
}
function animateDice(el, finalV, done){
  if(!el || DICE_MS <= 0 || reducedMotion()){ if(el) el.setAttribute('data-v', finalV); done(); return; }
  el.classList.add('rolling');
  var iv = setInterval(function(){ el.setAttribute('data-v', 1 + Math.floor(Math.random()*6)); }, 90);
  setTimeout(function(){
    clearInterval(iv);
    el.classList.remove('rolling');
    el.setAttribute('data-v', finalV);
    done();
  }, DICE_MS);
}
function suppliesBoxHTML(needs){
  var html = fmt(T('roadNeeds'), {n:needs}) + ' ' + fmt(T('youHaveSupplies'), {n:state.supplies});
  var ci = cur().c;
  if(state.supplies < needs && !traveled(ci)){
    if(state.coins >= 1){
      html += '<br><button class="tbtn buy" style="margin-top:8px" onclick="topUpSupply()">'+T('topUp')+'</button>';
    } else {
      html += '<br><button class="tbtn buy" style="margin-top:8px" onclick="emergencyAid('+needs+')">'+T('emergencyTitle')+'</button>';
    }
  }
  return html;
}
function fxNoteText(n){
  var L = state.language, gname = n.g ? GOODS[n.g].name[L] : '';
  switch(n.k){
    case 'paid': return fmt(T('fxPaid'), {n:n.n, c:n.c});
    case 'took': return fmt(T('fxTook'), {n:n.n, c:n.c});
    case 'tookLoad': return fmt(T('fxTookLoad'), {c:n.c, g:gname});
    case 'tookAll': return fmt(T('fxTookAll'), {c:n.c});
    case 'lostLoad': return fmt(T('fxLostLoad'), {g:gname});
    case 'usedSupplies': return fmt(T('fxUsedSupplies'), {n:n.n, c:n.c});
    case 'none': return T('fxNone');
  }
  return '';
}
function outcomeHTML(o){
  var L = state.language, ci = cur().c;
  var notes = (state.roadFx && state.roadFx[ci]) ? state.roadFx[ci] : [];
  var fxLine = notes.length ? '<div class="notebox terra" style="margin-top:12px"><b>'+T('fxLabel')+'</b> '+notes.map(fxNoteText).join(' ')+'</div>' : '';
  var info = o.risk && state.rolls ? state.rolls[ci] : null;
  var won = info && info.ok;
  var stamp = won ? o.risk.win.stamp[L] : o.stamp[L];
  var out = won ? o.risk.win.out[L] : o.out[L];
  var dice = (info && pendingRoll !== ci) ? diceHTML(ci, false) : '';
  return dice + '<span class="stamp2">'+stamp+'</span><h3 style="margin:.3rem 0 .3rem">'+T('whatHappened')+'</h3><p>'+wrap(out)+'</p>'+fxLine;
}
function traveled(ci){ return !!(state.traveled && state.traveled[ci]); }
function canSetOut(ci){
  if(traveled(ci)) return true;
  return state.decisions[ci] !== undefined && state.supplies >= CITIES[ci].road.needs;
}
function prepSetOut(ci){
  var nb = document.getElementById('nextbtn');
  if(!nb) return;
  nb.classList.remove('locked');
  nb.removeAttribute('aria-disabled');
  nb.textContent = traveled(ci) ? T('next') : T('setOut');
  nb.onclick = function(){ setOut(ci); };
}
function refreshRoad(ci){
  var box = document.getElementById('supbox');
  if(box) box.innerHTML = suppliesBoxHTML(CITIES[ci].road.needs);
  if(canSetOut(ci)) prepSetOut(ci);
  else {
    var nb = document.getElementById('nextbtn');
    if(nb){ nb.classList.add('locked'); nb.setAttribute('aria-disabled','true');
      nb.textContent = state.decisions[ci]===undefined ? T('decideFirst') : T('needMoreSupplies');
      nb.onclick = null; }
  }
  updateMeters();
}
function topUpSupply(){
  var ci = cur().c;
  if(state.coins < 1) { refreshRoad(ci); return; }
  state.coins -= 1; state.supplies += 1;
  refreshRoad(ci); updateMeters('m-supplies'); saveLocal();
}
function emergencyAid(needs){
  var ci = cur().c;
  state.supplies = Math.max(state.supplies, needs);
  state.coins += 5;
  var box = document.getElementById('supbox');
  if(box) box.innerHTML = '<b>'+T('emergencyTitle')+'.</b> '+T('emergencyBody')+'<br><br>'+fmt(T('roadNeeds'),{n:needs})+' '+fmt(T('youHaveSupplies'),{n:state.supplies});
  if(canSetOut(ci)) prepSetOut(ci);
  updateMeters('m-supplies'); saveLocal();
}
function mostValuableLoad(ci){
  var best=null, bestP=-1;
  GOOD_KEYS.forEach(function(g){
    if(state.cargo[g]>0){
      var p = priceOf(g, ci); if(p===null) p = 1;
      if(p>bestP){ bestP=p; best=g; }
    }
  });
  return best;
}
function chooseRoad(ci, oi){
  if(state.decisions[ci] !== undefined) return;
  state.decisions[ci] = oi;
  var o = CITIES[ci].road.options[oi], fx = o.fx;
  if(o.risk){
    var r = (typeof window.DICE_FORCE === 'number') ? window.DICE_FORCE : 1 + Math.floor(Math.random()*6);
    var ok = r >= o.risk.need;
    if(!state.rolls) state.rolls = {};
    state.rolls[ci] = {r:r, need:o.risk.need, ok:ok};
    if(ok) fx = o.risk.win.fx || {};
    pendingRoll = ci;
  }
  var notes = applyFx(fx, ci);
  if(!state.roadFx) state.roadFx = {};
  state.roadFx[ci] = notes;
  renderRoad(ci);
  if(pendingRoll !== ci){
    var oc = document.getElementById('outcome');
    if(oc && oc.scrollIntoView){ oc.scrollIntoView({behavior:'smooth', block:'center'}); }
  }
  saveLocal();
}
function applyFx(fx, ci){
  var notes = [];
  if(fx.coins){
    var cost = -fx.coins;
    if(fx.orLoad && state.coins < cost){
      var g = mostValuableLoad(ci);
      if(g){ state.cargo[g]--; notes.push({k:'tookLoad', c:state.coins, g:g}); }
      else { notes.push({k:'tookAll', c:state.coins}); state.coins = 0; }
    } else {
      state.coins = Math.max(0, state.coins + fx.coins);
      notes.push({k: fx.orLoad ? 'took' : 'paid', n:cost, c:state.coins});
    }
  }
  if(fx.supplies){
    var before = state.supplies;
    state.supplies = Math.max(0, state.supplies + fx.supplies);
    notes.push({k:'usedSupplies', n:(before - state.supplies), c:state.supplies});
  }
  if(fx.loseLoad){
    if(state.cargo[fx.loseLoad] > 0){ state.cargo[fx.loseLoad]--; notes.push({k:'lostLoad', g:fx.loseLoad}); }
    else if(typeof fx.elseCoins === 'number'){ state.coins = Math.max(0, state.coins + fx.elseCoins); notes.push({k:'paid', n:-fx.elseCoins, c:state.coins}); }
  }
  if(!notes.length) notes.push({k:'none'});
  return notes;
}
function setOut(ci){
  if(!traveled(ci)){
    state.supplies = Math.max(0, state.supplies - CITIES[ci].road.needs);
    if(!state.traveled) state.traveled = {};
    state.traveled[ci] = true;
    state.maxCity = Math.max(maxCity(), ci+1);
  }
  go(state.pos+1);
}

function num(id, lo, hi){ var v = parseInt(document.getElementById(id).value, 10); if(isNaN(v)) v = lo; return Math.max(lo, Math.min(hi, v)); }
function rebuildCaravan(){
  var ci = num('rb-city', 0, 5), coins = num('rb-coins', 0, 400), camels = num('rb-camels', 1, MAX_CAMELS), supplies = num('rb-supplies', 0, 30);
  var cargo = {}, total = 0;
  GOOD_KEYS.forEach(function(g){ cargo[g] = num('rb-'+g, 0, 10); total += cargo[g]; });
  if(total > camels * LOADS_PER_CAMEL){ document.getElementById('rb-err').textContent = T('rebuildTooMuch'); return; }
  var s = freshState();
  s.pos = SEQ.findIndex(function(x){ return x.t === 'city' && x.c === ci; });
  s.coins = coins; s.camels = camels; s.supplies = supplies; s.cargo = cargo;
  s.traveled = {}; s.maxCity = ci;
  CITIES.forEach(function(city, i){
    if(i < ci){ s.checks[i] = {}; city.check.forEach(function(q, qi){ s.checks[i][qi] = true; }); if(city.road){ s.decisions[i] = 0; s.traveled[i] = true; } }
  });
  s.carriedIn = {}; GOOD_KEYS.forEach(function(g){ s.carriedIn[g] = cargo[g]; });
  s.codeResumed = true;
  s.language = state.language;
  state = s;
  closeCodeBox();
  render();
}
/* Common handwriting mix-ups the alphabet cannot exclude. If a code fails its checksum, try every
   single-character swap from this table; accept only if exactly one candidate is valid. */
var CONFUSABLES = { 'S':['5'], '5':['S'], 'B':['8'], '8':['B'], 'Z':['2'], '2':['Z'], 'G':['6'], '6':['G'], 'Q':['0'], 'D':['0'], '0':['Q','D'], 'A':['4'], '4':['A'], 'T':['7'], '7':['T','1'], '1':['7'], 'Y':['V'], 'V':['Y'] };
function recoverCode(code){
  var c = normalizeCode(code);
  if(c.length !== 12) return null;
  var found = {};
  for(var i=0;i<12;i++){
    var alts = CONFUSABLES[c[i]] || [];
    for(var k=0;k<alts.length;k++){
      var cand = c.slice(0,i) + alts[k] + c.slice(i+1);
      if(decodeCode(cand)) found[cand] = true;
    }
  }
  var keys = Object.keys(found);
  return keys.length === 1 ? keys[0] : null;
}
function closeCodeBox(){ document.getElementById('codebox').hidden = true; }
function loadFromCode(){
  var v = document.getElementById('code-input').value;
  var s = decodeCode(v);
  if(!s){
    var fixed = recoverCode(v);
    if(fixed){ s = decodeCode(fixed); document.getElementById('code-err').textContent = fmt(T('codeFixed'), {code: fixed.replace(/(.{4})(?=.)/g, '$1-')}); }
  }
  if(!s){ document.getElementById('code-err').textContent = T('codeBad'); return; }
  /* same device? if the saved journey matches the code, use it — it has the full trade history */
  var local = loadLocal();
  if(local && local.pos === s.pos && local.coins === s.coins && local.camels === s.camels){ s = local; }
  s.language = state.language;
  state = s;
  closeCodeBox();
  render();
}
document.getElementById('codebox').addEventListener('click', function(e){
  if(e.target === this) closeCodeBox();
});

/* ---------- LIGHTBOX ---------- */
var lightbox = document.getElementById('lightbox');
function openLightbox(img){
  var fig = img.closest ? img.closest('figure') : null;
  var cap = fig && fig.querySelector('figcaption') ? fig.querySelector('figcaption').textContent : '';
  document.getElementById('lightbox-img').src = img.src;
  document.getElementById('lightbox-cap').textContent = cap;
  lightbox.hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  lightbox.hidden = true;
  document.getElementById('lightbox-img').src = '';
  document.body.style.overflow = '';
}
lightbox.addEventListener('click', closeLightbox);
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    if(!lightbox.hidden) closeLightbox();
    var cb = document.getElementById('codebox');
    if(cb && !cb.hidden) closeCodeBox();
  }
});
stage.addEventListener('click', function(e){
  var t = e.target;
  if(t && t.tagName === 'IMG' && t.closest && t.closest('figure.exhibit')) openLightbox(t);
});
stage.addEventListener('keydown', function(e){
  var t = e.target;
  if((e.key === 'Enter' || e.key === ' ') && t && t.tagName === 'IMG' && t.closest && t.closest('figure.exhibit')){
    e.preventDefault();
    openLightbox(t);
  }
});
function tagEnlargeableImages(){
  var imgs = stage.querySelectorAll('figure.exhibit img');
  for(var i=0;i<imgs.length;i++){
    imgs[i].setAttribute('tabindex','0');
    imgs[i].setAttribute('role','button');
    imgs[i].setAttribute('alt', T('enlargeLabel'));
  }
}

/* ---------- READ ALOUD (ported from the Salem build) ---------- */
var speech = { on:false };
function speechSupported(){
  return typeof window !== 'undefined' && 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
}
function initSpeech(){
  if(!speechSupported()) return;
  document.getElementById('listen-btn').hidden = false;
  setListenState();
  try { window.speechSynthesis.getVoices(); } catch(e){}
}
function pickVoice(){
  var lang = state.language==='es' ? 'es' : 'en';
  var voices = [];
  try { voices = window.speechSynthesis.getVoices() || []; } catch(e){ return null; }
  var cands = voices.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf(lang)===0; });
  if(!cands.length) return null;
  function score(v){
    var n = (v.name||'').toLowerCase(), l = (v.lang||'').toLowerCase(), sc = 0;
    if(n.indexOf('natural')>=0 || n.indexOf('neural')>=0 || n.indexOf('premium')>=0 || n.indexOf('enhanced')>=0) sc += 8;
    if(n.indexOf('google')>=0) sc += 6;
    if(n.indexOf('microsoft')>=0) sc += 3;
    if(lang==='en' && l==='en-us') sc += 2;
    if(lang==='es' && (l==='es-us' || l==='es-mx')) sc += 2;
    if(v.default) sc += 1;
    if(n.indexOf('espeak')>=0) sc -= 5;
    return sc;
  }
  cands.sort(function(a,b){ return score(b)-score(a); });
  return cands[0];
}
function collectSpeechText(){
  var clone = stage.cloneNode(true);
  ['.tooltip','button','textarea','.nav','select','input','.disclaimer','svg'].forEach(function(sel){
    var els = clone.querySelectorAll(sel);
    for(var i=0;i<els.length;i++){ els[i].parentNode.removeChild(els[i]); }
  });
  var sels = 'h1,h2,h3,.kicker,.tagline,.section-label,figcaption,.prose p,.notebox,.npc .who,.npc .bubble,.goodrow,.market-log,.decide-box .q,.outcome,.qc .qq,.qc .fb.show,.reflect-q .qtext,table.ledger tr,.codeval,p';
  var nodes = Array.prototype.slice.call(clone.querySelectorAll(sels));
  nodes.forEach(function(el){ el.__spk = true; });
  var inSet = [];
  nodes.forEach(function(el){
    var p = el.parentElement, nested = false;
    while(p){ if(p.__spk){ nested = true; break; } p = p.parentElement; }
    if(!nested) inSet.push(el);
  });
  var parts = [];
  inSet.forEach(function(el){
    var t;
    if(el.tagName === 'TR'){
      var cells = [];
      for(var i=0;i<el.children.length;i++){ cells.push(el.children[i].textContent.replace(/\s+/g,' ').trim()); }
      t = cells.join(', ');
    } else {
      t = el.textContent.replace(/\s+/g,' ').trim();
    }
    if(t) parts.push(t);
  });
  return parts;
}
function chunkSentences(t){
  return t.match(/[^.!?…]+[.!?…]+["'”)]?|[^.!?…]+$/g) || [t];
}
function setListenState(){
  var btn = document.getElementById('listen-btn');
  var lbl = document.getElementById('listen-label');
  if(!btn || !lbl) return;
  lbl.textContent = speech.on ? T('listenStop') : T('listenLabel');
  btn.classList.toggle('speaking', speech.on);
  btn.setAttribute('aria-pressed', speech.on ? 'true' : 'false');
}
function stopSpeech(){
  if(!speechSupported()) return;
  speech.on = false;
  try { window.speechSynthesis.cancel(); } catch(e){}
  setListenState();
}
function toggleSpeech(){
  if(!speechSupported()) return;
  if(speech.on){ stopSpeech(); return; }
  var parts = collectSpeechText();
  if(!parts.length) return;
  var voice = pickVoice();
  var fallbackLang = state.language==='es' ? 'es-US' : 'en-US';
  speech.on = true;
  setListenState();
  var chunks = [];
  parts.forEach(function(p){ chunkSentences(p).forEach(function(c){ c = c.trim(); if(c) chunks.push(c); }); });
  chunks.forEach(function(c, i){
    var u = new SpeechSynthesisUtterance(c);
    if(voice) u.voice = voice;
    u.lang = voice ? voice.lang : fallbackLang;
    u.rate = 0.95;
    if(i === chunks.length-1) u.onend = function(){ if(speech.on) stopSpeech(); };
    u.onerror = function(){ if(speech.on) stopSpeech(); };
    try { window.speechSynthesis.speak(u); } catch(e){}
  });
}

/* ---------- LANGUAGE ---------- */
function setLang(lang){
  state.language = lang;
  try { localStorage.setItem('caravanLang', lang); } catch(e){}
  document.getElementById('lang-en').classList.toggle('active', lang==='en');
  document.getElementById('lang-es').classList.toggle('active', lang==='es');
  document.documentElement.lang = lang;
  render();
}

/* ---------- INIT ---------- */
(function init(){
  var savedLang = null;
  try { savedLang = localStorage.getItem('caravanLang'); } catch(e){}
  if(savedLang==='es'||savedLang==='en') state.language = savedLang;
  document.getElementById('lang-en').classList.toggle('active', state.language==='en');
  document.getElementById('lang-es').classList.toggle('active', state.language==='es');
  document.documentElement.lang = state.language;
  initSpeech();
  render();
})();
</script>
